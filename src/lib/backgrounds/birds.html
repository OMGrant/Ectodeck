<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Birds</title>
<!--
  Ectodeck's built-in Birds: a murmuration of starlings over a treeline at
  dusk, drawn with the 2D canvas. A key press startles the birds at that
  key: they burst away from it, the shock runs through the flock as a wave,
  and the whole flock veers from the key before gathering again. The
  Background preset action moves the light from late afternoon to night.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "A murmuration of starlings wheeling over a treeline at dusk. Press a key and the birds there burst away from it; the shock runs through the whole flock. The Background preset action moves the light from afternoon to night.",
  "INPUTS": [
    { "NAME": "time", "TYPE": "long", "LABEL": "Light", "DEFAULT": 1, "VALUES": [0, 1, 2], "LABELS": ["Afternoon", "Dusk", "Night"] },
    { "NAME": "birds", "TYPE": "float", "LABEL": "Birds", "DEFAULT": 1, "MIN": 0.3, "MAX": 2 }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2340; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var setting = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  var light = Math.round(setting('time')) % 3, lightNow = light;
  var count = Math.round(420 * Math.min(2, Math.max(0.3, setting('birds'))));

  var canvas = document.getElementById('sky'), c = canvas.getContext('2d');
  var W = 854, H = 480;
  function resize() { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; }
  resize(); addEventListener('resize', resize);
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var mix = function (a, b, t) { return a + (b - a) * t; };
  var mixc = function (a, b, t) { return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; };
  var rgb = function (v, a) { return 'rgba(' + (v[0] | 0) + ',' + (v[1] | 0) + ',' + (v[2] | 0) + ',' + (a === undefined ? 1 : a) + ')'; };

  // the light: sky top, sky at the horizon, the sun's glow, the land, the birds
  var LOOKS = [
    { top: [92, 146, 200], low: [238, 214, 176], sun: [255, 236, 190], land: [40, 52, 44], bird: [26, 28, 34], sunY: 0.52 },
    { top: [44, 50, 96], low: [244, 150, 96], sun: [255, 190, 120], land: [24, 20, 30], bird: [16, 12, 20], sunY: 0.8 },
    { top: [8, 12, 30], low: [40, 46, 84], sun: [160, 170, 220], land: [6, 8, 14], bird: [4, 6, 12], sunY: 1.1 },
  ];
  function look() {
    var i = Math.floor(lightNow), t = lightNow - i, a = LOOKS[Math.min(i, 2)], b = LOOKS[Math.min(i + 1, 2)];
    return { top: mixc(a.top, b.top, t), low: mixc(a.low, b.low, t), sun: mixc(a.sun, b.sun, t), land: mixc(a.land, b.land, t), bird: mixc(a.bird, b.bird, t), sunY: mix(a.sunY, b.sunY, t) };
  }

  // a treeline along the bottom, made once
  // rounded crowns of trees, of different sizes, along a gently rolling ridge
  var crowns = [];
  for (var x = -0.02; x < 1.04; x += 0.012 + Math.random() * 0.02) crowns.push([x, 0.86 - 0.03 * Math.sin(x * 7 + 1) - Math.random() * 0.035, 0.012 + Math.random() * 0.022]);
  var stars = [];
  for (var i = 0; i < 120; i++) stars.push([Math.random(), Math.random() * 0.7, Math.random()]);

  // ---- the flock: boids in a shallow depth, drawn as small flapping birds
  var birds = [];
  for (var i = 0; i < count; i++) {
    var a = Math.random() * 6.283, r = Math.random() * 0.12;
    birds.push({ x: 0.5 + Math.cos(a) * r * 1.6, y: 0.4 + Math.sin(a) * r, z: Math.random(), vx: rand(-0.1, 0.1), vy: rand(-0.05, 0.05), flap: Math.random() * 6.283, fear: 0 });
  }
  // the point the flock drifts around, wandering slowly across the sky
  var home = { x: 0.5, y: 0.4 };
  // startles waiting to happen: the shock spreads from bird to bird
  var shocks = [];

  window.addEventListener('ectodeck:press', function (e) {
    if (!e.detail.down) return;
    var kx = e.detail.x, ky = e.detail.y;
    shocks.push({ x: kx, y: ky, age: 0 });
    birds.forEach(function (b) {
      var dx = (b.x - kx) * W / H, dy = b.y - ky, d = Math.hypot(dx, dy) || 1e-3;
      // right at the key, a burst; further off, a turn away that weakens with distance
      var push = d < 0.14 ? 1.1 * (1 - d / 0.14) + 0.35 : 0.08 / (1 + d * 8);
      b.vx += dx / d * push * H / W; b.vy += dy / d * push;
      if (d < 0.14) b.fear = 1;
    });
  });
  window.addEventListener('ectodeck:look', function (e) { light = ((light + e.detail.steps) % 3 + 3) % 3; });

  // a grid of cells, so each bird only looks at its neighbours
  var CELL = 0.05, grid = new Map();
  function neighbours(b, fn) {
    var gx = Math.floor(b.x / CELL), gy = Math.floor(b.y / CELL);
    for (var y = gy - 1; y <= gy + 1; y++) for (var x = gx - 1; x <= gx + 1; x++) {
      var list = grid.get(x * 1000 + y);
      if (list) for (var i = 0; i < list.length; i++) fn(list[i]);
    }
  }

  var last = performance.now(), start = last;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000), t = (now - start) / 1000;
    last = now;
    lightNow += Math.max(-dt * 0.5, Math.min(dt * 0.5, light - lightNow));
    var L = look();

    home.x = 0.5 + 0.22 * Math.sin(t * 0.07) + 0.05 * Math.sin(t * 0.23);
    home.y = 0.38 + 0.12 * Math.sin(t * 0.11 + 1.3);

    grid.clear();
    birds.forEach(function (b) { var k = Math.floor(b.x / CELL) * 1000 + Math.floor(b.y / CELL); (grid.get(k) || grid.set(k, []).get(k)).push(b); });
    birds.forEach(function (b) {
      var ax = 0, ay = 0, cx = 0, cy = 0, vx = 0, vy = 0, n = 0;
      neighbours(b, function (o) {
        if (o === b) return;
        var dx = o.x - b.x, dy = o.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 > CELL * CELL) return;
        cx += o.x; cy += o.y; vx += o.vx; vy += o.vy; n++;
        if (d2 < 0.00016) { var d = Math.sqrt(d2) || 1e-4; ax -= dx / d * 0.9; ay -= dy / d * 0.9; }
        // fear spreads: a startled neighbour startles this one a moment later
        if (o.fear > 0.55 && b.fear < o.fear - 0.1) { b.fear = o.fear * 0.88; b.vx += (b.x - o.x) * 4; b.vy += (b.y - o.y) * 4; }
      });
      if (n) { ax += (cx / n - b.x) * 1.4 + (vx / n - b.vx) * 2.6; ay += (cy / n - b.y) * 1.4 + (vy / n - b.vy) * 2.6; }
      // the flock's pull toward its wandering centre, and away from the ground
      ax += (home.x - b.x) * 0.9; ay += (home.y - b.y) * 1.0;
      if (b.y > 0.72) ay -= (b.y - 0.72) * 8;
      // the edges of the view turn the birds back
      if (b.x < 0.14) ax += (0.14 - b.x) * 5; if (b.x > 0.86) ax -= (b.x - 0.86) * 5;
      if (b.y < 0.1) ay += (0.1 - b.y) * 5;
      b.vx += ax * dt; b.vy += ay * dt;
      var sp = Math.hypot(b.vx, b.vy), max = 0.28 + b.fear * 0.35, min = 0.08;
      if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; }
      if (sp < min) { b.vx *= min / sp; b.vy *= min / sp; }
      b.x += b.vx * dt * H / W * 1.4; b.y += b.vy * dt;
      b.fear = Math.max(0, b.fear - dt * 1.4);
      b.flap += dt * (9 + b.fear * 14 + sp * 10);
    });
    shocks.forEach(function (s) { s.age += dt; });
    shocks = shocks.filter(function (s) { return s.age < 1; });

    // sky
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(L.top)); g.addColorStop(0.75, rgb(L.low)); g.addColorStop(1, rgb(L.low));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    var sx = W * 0.72, sy = H * L.sunY;
    var sg = c.createRadialGradient(sx, sy, 0, sx, sy, W * 0.5);
    sg.addColorStop(0, rgb(L.sun, 0.9)); sg.addColorStop(0.08, rgb(L.sun, 0.45)); sg.addColorStop(1, rgb(L.sun, 0));
    c.fillStyle = sg; c.fillRect(0, 0, W, H);
    var night = Math.max(0, lightNow - 1);
    if (night > 0) stars.forEach(function (s) { c.fillStyle = 'rgba(255,255,255,' + night * (0.3 + 0.5 * s[2]) * (0.7 + 0.3 * Math.sin(t * 2 + s[2] * 20)) + ')'; c.fillRect(s[0] * W, s[1] * H, 1.2, 1.2); });

    // the birds, far ones smaller and paler, each a pair of beating wings
    birds.sort(function (a, b) { return a.z - b.z; });
    birds.forEach(function (b) {
      var x = b.x * W, y = b.y * H, size = 2.2 + b.z * 3.2;
      var wing = Math.sin(b.flap), heading = Math.atan2(b.vy, b.vx * W / H);
      c.strokeStyle = rgb(mixc(L.low, L.bird, 0.55 + b.z * 0.45), 0.95);
      c.lineWidth = 0.9 + b.z * 0.9;
      c.lineCap = 'round';
      var dir = Math.cos(heading) >= 0 ? 1 : -1;
      c.beginPath();
      c.moveTo(x - size, y - wing * size * 0.8);
      c.quadraticCurveTo(x - size * 0.4, y - wing * size * 0.2 - size * 0.2, x, y);
      c.quadraticCurveTo(x + size * 0.4, y - wing * size * 0.2 - size * 0.2, x + size, y - wing * size * 0.8);
      c.stroke();
      c.fillStyle = c.strokeStyle;
      c.beginPath(); c.ellipse(x + dir * size * 0.15, y + size * 0.05, size * 0.35, size * 0.16, 0, 0, 6.283); c.fill();
    });

    // the startle: a faint ring of disturbed air at the key, for a moment
    shocks.forEach(function (s) {
      var r = 6 + s.age * 150;
      c.strokeStyle = rgb(L.sun, 0.35 * (1 - s.age));
      c.lineWidth = 1.5;
      c.beginPath(); c.arc(s.x * W, s.y * H, r, 0, 6.283); c.stroke();
    });

    // the treeline
    c.fillStyle = rgb(L.land);
    c.fillRect(0, H * 0.88, W, H);
    crowns.forEach(function (k) { c.beginPath(); c.ellipse(k[0] * W, k[1] * H, k[2] * W, k[2] * W * 1.25, 0, 0, 6.283); c.fill(); c.fillRect(k[0] * W - k[2] * W, k[1] * H, k[2] * W * 2, H); });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

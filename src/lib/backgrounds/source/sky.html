<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sky</title>
<!--
  Ectodeck's built-in Sky: drifting clouds under a low sun, from Vanta (MIT,
  Teng Bao) on three.js (MIT). A key press breaks the clouds at that key and lets sunbeams through; the
  Background look action moves the sun from morning through sunset to night.

  Built by scripts/build_backgrounds.py, which inlines the libraries from
  third_party; edit this source, not the built page.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "Soft clouds drifting past a low sun. Press a key and the clouds break open there, letting sunbeams through; the Background look action moves the sun from morning to sunset to night. From Vanta (MIT) on three.js (MIT).",
  "INPUTS": [
    { "NAME": "time", "TYPE": "long", "LABEL": "Time of day", "DEFAULT": 1, "VALUES": [0, 1, 2, 3], "LABELS": ["Morning", "Afternoon", "Sunset", "Night"] },
    { "NAME": "speed", "TYPE": "float", "LABEL": "Wind", "DEFAULT": 0.8, "MIN": 0.2, "MAX": 3 }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6a9ad6; }
  #sky { position: fixed; inset: 0; }
  #light { position: fixed; inset: 0; mix-blend-mode: screen; pointer-events: none; }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<canvas id="light" aria-hidden="true"></canvas>
<script>/*THREE*/</script>
<script>/*VANTA_CLOUDS*/</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var num = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  // each time of day: sky, clouds, their shadows, the sun, its glow and its light
  var TIMES = [
    { skyColor: 0x8fc4ee, cloudColor: 0xc6d8ee, cloudShadowColor: 0x5a7394, sunColor: 0xffe6a8, sunGlareColor: 0xffc38a, sunlightColor: 0xffe8c0 },
    { skyColor: 0x68b8d7, cloudColor: 0xadc1de, cloudShadowColor: 0x183550, sunColor: 0xff9919, sunGlareColor: 0xff6633, sunlightColor: 0xff9933 },
    { skyColor: 0xd4745a, cloudColor: 0xe0a88c, cloudShadowColor: 0x4a2a44, sunColor: 0xff7a2a, sunGlareColor: 0xff4e2e, sunlightColor: 0xff8a50 },
    { skyColor: 0x0c1428, cloudColor: 0x3a4a6a, cloudShadowColor: 0x05080f, sunColor: 0xdfe8ff, sunGlareColor: 0x6a80b0, sunlightColor: 0x9ab0e0 },
  ];
  var time = Math.round(num('time')) % 4, base = num('speed');
  var effect = VANTA.CLOUDS(Object.assign({ el: '#sky', THREE: THREE, mouseControls: false, touchControls: false, gyroControls: false, speed: base }, TIMES[time]));

  // a press breaks the clouds at the key: a soft bright opening that swells
  // quickly, shafts of sunlight falling from it, then the cloud closes again
  var canvas = document.getElementById('light'), c = canvas.getContext('2d');
  function size() { canvas.width = innerWidth; canvas.height = innerHeight; }
  size(); addEventListener('resize', size);
  var breaks = [];
  window.addEventListener('ectodeck:press', function (e) {
    if (e.detail.down) breaks.push({ x: e.detail.x * innerWidth, y: e.detail.y * innerHeight, born: performance.now(), seed: Math.random() * 10 });
  });
  window.addEventListener('ectodeck:look', function (e) {
    time = ((time + e.detail.steps) % 4 + 4) % 4;
    effect.setOptions(TIMES[time]);
  });
  var hexRgb = function (h) { return [(h >> 16) & 255, (h >> 8) & 255, h & 255]; };
  (function draw(now) {
    c.clearRect(0, 0, canvas.width, canvas.height);
    var sun = hexRgb(TIMES[time].sunColor);
    breaks = breaks.filter(function (b) { return now - b.born < 6000; });
    breaks.forEach(function (b) {
      var age = (now - b.born) / 1000;
      var open = Math.min(1, age / 0.35) * (1 - Math.max(0, (age - 2.5) / 3.5));
      var r = 30 + 60 * Math.min(1, age / 0.6);
      // the opening
      var g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 1.6);
      g.addColorStop(0, 'rgba(255,252,240,' + 0.95 * open + ')');
      g.addColorStop(0.2, 'rgba(' + sun + ',' + 0.7 * open + ')');
      g.addColorStop(0.45, 'rgba(' + sun + ',' + 0.35 * open + ')');
      g.addColorStop(1, 'rgba(' + sun + ',0)');
      c.fillStyle = g; c.beginPath(); c.arc(b.x, b.y, r * 1.6, 0, 6.283); c.fill();
      // shafts of light falling from it, slightly fanned, shimmering
      for (var i = 0; i < 5; i++) {
        var off = (i - 2) * r * 0.32, spread = (i - 2) * 0.12;
        var len = canvas.height - b.y + 40, w = r * (0.18 + 0.1 * Math.sin(b.seed + i * 2.1));
        var a = open * (0.22 + 0.12 * Math.sin(now / 400 + b.seed + i));
        var sg = c.createLinearGradient(0, b.y, 0, b.y + len);
        sg.addColorStop(0, 'rgba(' + sun + ',' + a + ')'); sg.addColorStop(1, 'rgba(' + sun + ',0)');
        c.fillStyle = sg;
        c.beginPath();
        c.moveTo(b.x + off - w * 0.5, b.y); c.lineTo(b.x + off + w * 0.5, b.y);
        c.lineTo(b.x + off + spread * len + w * 1.6, b.y + len); c.lineTo(b.x + off + spread * len - w * 1.6, b.y + len);
        c.fill();
      }
    });
    requestAnimationFrame(draw);
  })(performance.now());
})();
</script>
</body>
</html>

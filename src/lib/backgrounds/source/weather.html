<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weather</title>
<!--
  Ectodeck's built-in Weather: Sky's sea of clouds, from Vanta (MIT, Teng
  Bao) on three.js (MIT), in the weather you choose and lit for the time of
  day. The weather is drawn after Apple's Weather app, in the clouds' own
  renderer straight after them, so the deck never catches it half drawn:
  soft rain streaks, snow, a drifting haze, lightning glowing inside the
  clouds, and at night the stars and the moon in its real phase.

  A key press does something in the weather there: a cloud puffs up, rain
  squalls across, snow gusts out, the fog parts, lightning strikes, or at
  night a shooting star falls.

  Built by scripts/build_backgrounds.py, which inlines the libraries from
  third_party; edit this source, not the built page.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "Weather: Sky's sea of clouds in the weather you choose, or the live weather in your city, lit for the time of day, with rain, snow, fog, lightning, and at night the stars and the moon in its real phase. A key press does something in the weather there: a cloud puffs up, raindrops splash on the glass, snow gusts out, the fog parts, lightning strikes, or at night a shooting star falls. Weather data by Open-Meteo.com (CC BY 4.0). Clouds from Vanta (MIT) on three.js (MIT); the moon photographed by NASA's Goddard Space Flight Center.",
  "INPUTS": [
    { "NAME": "place", "TYPE": "place", "LABEL": "City" },
    { "NAME": "weather", "TYPE": "long", "LABEL": "Weather", "DEFAULT": 0, "VALUES": [-1, 0, 1, 2, 3, 6, 4, 5], "LABELS": ["Automatic", "Clear", "Cloudy", "Rain", "Thunderstorm", "Dry thunderstorm", "Snow", "Fog"] },
    { "NAME": "time", "TYPE": "long", "LABEL": "Time of day", "DEFAULT": -1, "VALUES": [-1, 0, 1, 2, 3], "LABELS": ["Automatic", "Morning", "Afternoon", "Sunset", "Night"] },
    { "NAME": "speed", "TYPE": "float", "LABEL": "Wind", "DEFAULT": 0.8, "MIN": 0.2, "MAX": 3 }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6a9ad6; }
  #sky { position: fixed; inset: 0; }
</style>
</head>

    uniforms: { map: { value: null } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D map; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(map, vUv).rgb, 1.0); }',
    depthTest: false, depthWrite: false
  });
  var copyScene = new THREE.Scene();
  copyScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), copyMaterial));
  // for a dissolve between two views: the old one, laid over the new with a fading amount
  var oldView = null;
  var blendMaterial = new THREE.ShaderMaterial({
    uniforms: { old: { value: null }, amount: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D old; uniform float amount; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(old, vUv).rgb, amount); }',
    transparent: true, depthTest: false, depthWrite: false
  });
  // The clouds are drawn at a third of the size and scaled up smoothly, as
  // Sky draws them, which keeps them soft; the sun, moon, stars and weather
  // are drawn over them at full size, so those stay sharp.
  var soft = null;
  var upMaterial = new THREE.ShaderMaterial({
    uniforms: { map: { value: null } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D map; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(map, vUv).rgb, 1.0); }',
    depthTest: false, depthWrite: false
  });
  var upScene = new THREE.Scene();
  upScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), upMaterial));
  function drawClouds(scene, camera, target) {
    var w = Math.max(1, Math.round(bufferSize.x / 3)), h = Math.max(1, Math.round(bufferSize.y / 3));
    if (!soft || soft.width !== w || soft.height !== h) {
      if (soft) soft.dispose();
      soft = new THREE.WebGLRenderTarget(w, h, { depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
      upMaterial.uniforms.map.value = soft.texture;
    }
    // Sky works out its picture and its camera from these, in pixels: both at the smaller size
    var res = effect.uniforms.iResolution.value, mouse = effect.uniforms.iMouse.value;
    var rx = res.x, ry = res.y, mx = mouse.x, my = mouse.y;
    res.set(w, h); mouse.set(mx * w / rx, my * h / ry);
    renderer.setRenderTarget(soft);
    drawScene(scene, camera);
    res.set(rx, ry); mouse.set(mx, my);
    renderer.setRenderTarget(target);
    drawScene(upScene, layerCamera);
  }
  var blendScene = new THREE.Scene();
  blendScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), blendMaterial));
  renderer.render = function (scene, camera) {
    renderer.getDrawingBufferSize(bufferSize);
    if (!finished || finished.width !== bufferSize.x || finished.height !== bufferSize.y) {
      if (finished) finished.dispose();
      finished = new THREE.WebGLRenderTarget(bufferSize.x, bufferSize.y, { depthBuffer: false });
      copyMaterial.uniforms.map.value = finished.texture;
    }
    stepEasing(performance.now());
    if (shown.fromView) {
      if (!oldView || oldView.width !== bufferSize.x || oldView.height !== bufferSize.y) {
        if (oldView) oldView.dispose();
        oldView = new THREE.WebGLRenderTarget(bufferSize.x, bufferSize.y, { depthBuffer: false });
        blendMaterial.uniforms.old.value = oldView.texture;
      }
      showView(shown.fromView);
      drawClouds(scene, camera, oldView);
      showView(shown);
      drawClouds(scene, camera, finished);
      // the old view laid over the new, fading away
      blendMaterial.uniforms.amount.value = 1 - shown.mixView;
      var keepClear = renderer.autoClear; renderer.autoClear = false;
      drawScene(blendScene, layerCamera);
      renderer.autoClear = keepClear;
    } else {
      drawClouds(scene, camera, finished);
    }
    var now = performance.now() / 1000;
    slots.forEach(function (slot, i) { var b = presses[i]; if (b) slot.set(b.x, b.y, now - b.at, b.seed); else slot.z = -1; });
    layer.uniforms.t.value = now;
    layer.uniforms.skyTime.value = effect.uniforms.iTime.value;
    var res = effect.uniforms.iResolution.value, mouse = effect.uniforms.iMouse.value;
    if (res.x > 0) layer.uniforms.skyMouse.value.set(mouse.x / res.x, mouse.y / res.y);
    layer.uniforms.size.value.set(innerWidth, innerHeight);
    layer.uniforms.ratio.value = renderer.getPixelRatio();
    var keep = renderer.autoClear; renderer.autoClear = false;
    drawScene(layerScene, layerCamera);
    // then the finished frame onto the screen, whole; it covers every pixel, so no clear
    renderer.setRenderTarget(null);
    drawScene(copyScene, layerCamera);
    renderer.autoClear = keep;
  };
  // ---- changes of weather and time of day ease in: every colour and setting
  // of the sky, clouds and weather moves from where it is to where it is going.
  // Each change takes about three seconds. Between weathers seen from the same
  // place the cloud morphs where it is (it forms, thickens, reshapes, clears);
  // between places (above the cloud and under it) one pattern cross-fades into
  // the other where it stands. Nothing flies.
  var COLOURS = ['skyTopColor', 'skyColor', 'skyHorizonColor', 'skyGlowColor', 'cloudColor', 'cloudShadowColor', 'sunColor', 'sunGlareColor', 'sunlightColor', 'backgroundColor'];
  var SKY_NUMBERS = ['sunHeight', 'clearing', 'lookAt', 'flip', 'lift', 'stretch', 'swing'];
  var LAYER_NUMBERS = ['aClear', 'aCloudy', 'aRain', 'aSnow', 'aStorm', 'aFog', 'night', 'dusk'];
  var rgb = function (h) { return [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255]; };
  var hexOf = function (c) { return (Math.round(c[0] * 255) << 16) | (Math.round(c[1] * 255) << 8) | Math.round(c[2] * 255); };
  function goal() {
    var l = look(time), w = weather, st = { speed: pace() };
    COLOURS.forEach(function (k) { st[k] = rgb(l[k]); });
    SKY_NUMBERS.forEach(function (k) { st[k] = l[k]; });
    // how much of each thing is in the air
    Object.assign(st, { aClear: +(w === 0), aCloudy: +(w === 1), aRain: w === 2 ? 1 : w === 3 ? 1.3 : 0, aSnow: +(w === 4), aStorm: +(w === 3 || w === 6), aFog: +(w === 5), night: +(time === 3), dusk: +(time === 2) });
    Object.assign(st, skyPositions());
    st.w = w;
    return st;
  }
  function show(st) {
    COLOURS.forEach(function (k) {
      var u = effect.uniforms[k];
      if (u) u.value.set(st[k][0], st[k][1], st[k][2]);
      effect.options[k] = hexOf(st[k]);
    });
    SKY_NUMBERS.forEach(function (k) {
      if (effect.uniforms[k]) effect.uniforms[k].value = st[k];
      effect.options[k] = st[k];
    });
    // Sky places its clouds at speed x time, and its clock has been running
    // since the page opened, so changing that speed would sweep every cloud a
    // long way. It stays at 1; how fast the clouds drift is set by how fast the
    // clock runs instead (squared, as it was felt before), which never moves them.
    effect.options.speed = st.speed * st.speed;
    if (effect.uniforms.speed) effect.uniforms.speed.value = 1;
    LAYER_NUMBERS.forEach(function (k) { layer.uniforms[k].value = st[k]; });
    layer.uniforms.cloudLight.value.setRGB(st.cloudColor[0], st.cloudColor[1], st.cloudColor[2]);
    layer.uniforms.sunColor.value.setRGB(st.sunColor[0], st.sunColor[1], st.sunColor[2]);
    layer.uniforms.lookAt.value = st.lookAt; layer.uniforms.swing.value = st.swing;
    // the sun drawn in the sky sets as night comes (the clouds keep their moonlight)
    layer.uniforms.sunHeight.value = st.sunHeight + (-0.3 - st.sunHeight) * st.night;
    layer.uniforms.under.value = st.flip < 0 ? 1 : 0;
    layer.uniforms.sunPos.value.set(st.sunX, st.sunY);
    layer.uniforms.moonPos.value.set(st.moonX, st.moonY);
    layer.uniforms.moonUp.value = st.moonUp;
  }
  // Sky's view settings: the ones that move the camera or the cloud around it
  var VIEW = ['clearing', 'lookAt', 'flip', 'lift', 'stretch', 'swing'];
  function viewOf(st) { var v = {}; VIEW.forEach(function (k) { v[k] = st[k]; }); return v; }
  function showView(v) { VIEW.forEach(function (k) { if (effect.uniforms[k]) effect.uniforms[k].value = v[k]; effect.options[k] = v[k]; }); }
  var ease = function (x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  function between(a, b, e, dissolving) {
    var st = { w: b.w };
    COLOURS.forEach(function (k) { st[k] = [0, 1, 2].map(function (i) { return a[k][i] + (b[k][i] - a[k][i]) * e; }); });
    Object.keys(b).forEach(function (k) { if (k !== 'w' && COLOURS.indexOf(k) < 0) st[k] = a[k] + (b[k] - a[k]) * e; });
    // a new view is not flown to: the old view and the new are both drawn, and
    // one slowly dissolves into the other
    if (dissolving) { Object.assign(st, viewOf(b)); st.fromView = viewOf(a); st.mixView = e; }
    return st;
  }
  var shown = goal(), easing = null;
  function relight(ms) {
    layer.uniforms.weather.value = weather;
    // start from what is on screen: in the middle of a dissolve, the view it was heading for
    var from = shown, to = goal();
    delete from.fromView; delete from.mixView;
    // a new view is cross-faded in place, never flown to: blending the camera
    // swings the whole sky, and Sky's own sun rides across it on the way. The
    // cloud's shape is a scale of the whole cloud field, so a new shape is too.
    var moves = ['lookAt', 'flip', 'lift', 'swing', 'stretch'].some(function (k) { return from[k] !== to[k]; });
    easing = { from: from, to: to, start: performance.now(), ms: ms || 3000, dissolving: moves };
  }
  function stepEasing(now) {
    if (!easing) return;
    var raw = Math.min(1, (now - easing.start) / easing.ms);
    shown = between(easing.from, easing.to, ease(raw), easing.dissolving && raw < 1);
    show(shown);
    if (raw >= 1) easing = null;
  }
  layer.uniforms.weather.value = weather;
  show(shown);

  // a new weather, time of day or wind arrives in place, so the clouds keep
  // drifting; any other setting starts the page again with the new address
  var startQuery = location.search;
  window.addEventListener('ectodeck:params', function (e) {
    var p = e.detail, now = new URLSearchParams(location.search), was = new URLSearchParams(startQuery);
    var keys = Array.from(now.keys()).concat(Array.from(was.keys()));
    for (var i = 0; i < keys.length; i++) if (['time', 'speed', 'weather'].indexOf(keys[i]) < 0 && now.get(keys[i]) !== was.get(keys[i])) return location.reload();
    if (p.time !== undefined) { timeSetting = Math.round(p.time); time = timeSetting < 0 ? clockTime() : timeSetting % 4; }
    if (p.speed !== undefined) { base = Number(p.speed); layer.uniforms.wind.value = base; }
    if (p.weather !== undefined) { weatherSetting = Math.round(p.weather); weather = chosenWeather(); askLive(); }
    relight(3000);
  });
  askLive();
  setInterval(askLive, 15 * 60 * 1000);
  setInterval(function () {
    layer.uniforms.phase.value = moonPhase();
    if (timeSetting < 0 && clockTime() !== time) { time = clockTime(); relight(3000); }
    // on Automatic the sun and moon move on with the clock
    else if (timeSetting < 0 && !easing) relight(3000);
  }, 60000);
})();
</script>

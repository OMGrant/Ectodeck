<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aquarium</title>
<!--
  Ectodeck's built-in Aquarium: a planted tank drawn with the 2D canvas.
  A key press sprinkles food at that key and the fish nearby come to eat;
  two quick presses on one key tap the glass and scatter them. The
  Background preset action steps through the time of day.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "A planted tank with clownfish, a blue tang, angelfish and a school of neon tetras. Press a key to feed the fish there; press it twice quickly to tap the glass. The Background preset action steps through the time of day.",
  "INPUTS": [
    { "NAME": "time", "TYPE": "long", "LABEL": "Light", "DEFAULT": 0, "VALUES": [0, 1, 2], "LABELS": ["Day", "Dusk", "Night"] },
    { "NAME": "fish", "TYPE": "float", "LABEL": "Fish", "DEFAULT": 1, "MIN": 0.3, "MAX": 2 },
    { "NAME": "bubbles", "TYPE": "bool", "LABEL": "Bubbler", "DEFAULT": true }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06182b; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="tank" aria-hidden="true"></canvas>
<script>
(function () {
  // ---- settings, from the address or the declared defaults
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var setting = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  var light = Math.round(setting('time')) % 3;          // 0 day, 1 dusk, 2 night; eased below
  var fishScale = Math.min(2, Math.max(0.3, setting('fish')));
  var bubbler = q.has('bubbles') ? q.get('bubbles') === '1' : declared.bubbles;

  var canvas = document.getElementById('tank');
  var c = canvas.getContext('2d');
  var W = 854, H = 480;
  function resize() {
    var r = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
    c.setTransform(r, 0, 0, r, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var mix = function (a, b, t) { return a + (b - a) * t; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var SURFACE = 22;
  var sandAt = function (x) { return H - 58 + Math.sin(x * 0.011) * 9 + Math.sin(x * 0.027 + 1.3) * 4; };

  // ---- light: day, dusk and night, blended so the dial eases between them
  var LOOKS = [
    { top: [92, 178, 186], mid: [26, 102, 118], deep: [6, 38, 52], rays: 0.14, sand: [178, 160, 124], plant: [62, 128, 58], dim: 0 },
    { top: [196, 150, 112], mid: [58, 76, 96], deep: [14, 22, 40], rays: 0.1, sand: [146, 120, 100], plant: [56, 96, 60], dim: 0.15 },
    { top: [26, 52, 82], mid: [8, 24, 44], deep: [2, 8, 18], rays: 0.05, sand: [66, 74, 86], plant: [24, 56, 50], dim: 0.45 },
  ];
  var lightNow = light;
  function look() {
    var i = Math.floor(lightNow) % 3, j = (i + 1) % 3, t = lightNow - Math.floor(lightNow);
    var a = LOOKS[i], b = LOOKS[j];
    var m = function (k) { return a[k].map(function (v, n) { return mix(v, b[k][n], t); }); };
    return { top: m('top'), mid: m('mid'), deep: m('deep'), sand: m('sand'), plant: m('plant'), rays: mix(a.rays, b.rays, t), dim: mix(a.dim, b.dim, t) };
  }
  var rgb = function (v, k) { k = k === undefined ? 1 : k; return 'rgb(' + (v[0] * k | 0) + ',' + (v[1] * k | 0) + ',' + (v[2] * k | 0) + ')'; };

  // ---- the tank's furniture
  var plants = [];
  function makePlants() {
    plants = [];
    var spots = [0.04, 0.1, 0.17, 0.3, 0.46, 0.58, 0.71, 0.83, 0.9, 0.96];
    spots.forEach(function (s, n) {
      var x = s * W + rand(-12, 12);
      var kelp = n % 3 != 1;
      plants.push({ x: x, h: kelp ? rand(0.45, 0.8) * H : rand(0.14, 0.24) * H, blades: kelp ? 1 : 5, width: kelp ? rand(9, 14) : 4, phase: rand(0, 6.28), shade: rand(0.75, 1.1), front: n % 4 == 0 });
    });
  }
  var rocks = [];
  function makeRocks() {
    rocks = [[0.22, 34, 22], [0.26, 20, 14], [0.63, 46, 28], [0.68, 26, 16], [0.88, 30, 18]].map(function (r) {
      var x = r[0] * W;
      return { x: x, y: sandAt(x) + 3, rx: r[1] * 1.15, ry: r[2] * 1.5, tone: rand(0.8, 1.05) };
    });
  }
  makePlants(); makeRocks();

  // ---- fish
  var SPECIES = {
    clown: { len: 40, tall: 0.46, speed: 42, wiggle: 9, school: false },
    tang: { len: 58, tall: 0.62, speed: 50, wiggle: 7, school: false },
    angel: { len: 44, tall: 1.05, speed: 30, wiggle: 5, school: false },
    tetra: { len: 20, tall: 0.34, speed: 64, wiggle: 14, school: true },
  };
  var fish = [];
  function addFish(kind, x, y) {
    var s = SPECIES[kind];
    var z = rand(0.78, 1.05);
    fish.push({ kind: kind, s: s, x: x === undefined ? rand(60, W - 60) : x, y: y === undefined ? rand(SURFACE + 40, sandAt(0) - 50) : y,
      vx: rand(-1, 1) * s.speed, vy: rand(-0.2, 0.2) * s.speed, z: z, face: 1, tail: rand(0, 6.28), wanderAt: 0, tx: 0, ty: 0,
      full: rand(0, 1), fright: 0, hue: rand(-8, 8) });
  }
  var roster = [];
  function stock() {
    roster = [];
    var n = function (k) { return Math.max(0, Math.round(k * fishScale)); };
    for (var i = 0; i < n(2); i++) roster.push('clown');
    for (var i = 0; i < n(1); i++) roster.push('tang');
    for (var i = 0; i < n(2); i++) roster.push('angel');
    for (var i = 0; i < n(11); i++) roster.push('tetra');
    fish = [];
    roster.forEach(function (k) { addFish(k); });
  }
  stock();

  var food = [];
  var bubbles = [];
  var rings = [];

  // ---- the deck: food at a key, a tap on the glass when pressed twice
  var lastPress = { key: -1, at: 0 };
  function feed(x, y) {
    for (var i = 0; i < 6; i++) food.push({ x: x + rand(-18, 18), y: y + rand(-10, 10), vy: rand(10, 18), sway: rand(0, 6.28), size: rand(2, 3.2), hue: rand(18, 42) });
    rings.push({ x: x, y: y, age: 0, kind: 'drop' });
  }
  function tap(x, y) {
    rings.push({ x: x, y: y, age: 0, kind: 'tap' });
    fish.forEach(function (f) {
      var dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < 260) { f.fright = 1.2; f.vx += dx / d * f.s.speed * 4; f.vy += dy / d * f.s.speed * 3; }
    });
    for (var i = 0; i < 5; i++) bubbles.push({ x: x + rand(-10, 10), y: y + rand(-6, 6), r: rand(1.5, 3.5), wob: rand(0, 6.28), v: rand(30, 55) });
  }
  window.addEventListener('ectodeck:press', function (e) {
    var d = e.detail; if (!d.down) return;
    var x = d.x * W, y = d.y * H, now = performance.now();
    if (lastPress.key === d.key && now - lastPress.at < 380) { tap(x, y); lastPress.key = -1; }
    else { feed(x, y); lastPress = { key: d.key, at: now }; }
  });
  // the Background preset action steps through the time of day
  window.addEventListener('ectodeck:look', function (e) { light = ((light + e.detail.steps) % 3 + 3) % 3; });

  // ---- movement
  function steer(f, dt, t) {
    var s = f.s, want = s.speed * (f.fright > 0 ? 2.6 : 1);
    var ax = 0, ay = 0;
    // food: the nearest pellet in reach, while hungry
    var target = null, best = 1e9;
    if (f.full < 1) food.forEach(function (p) { var d = Math.hypot(p.x - f.x, p.y - f.y); if (d < 230 && d < best) { best = d; target = p; } });
    if (target && f.fright <= 0) {
      ax += (target.x - f.x) / best * want * 3; ay += (target.y - f.y) / best * want * 3;
      if (best < 7 + s.len * 0.2) { target.eaten = true; f.full = Math.min(1.4, f.full + 0.35); bubbles.push({ x: f.x + f.face * s.len * 0.4, y: f.y, r: 1.4, wob: 0, v: 40 }); }
    } else {
      if (t > f.wanderAt || Math.hypot(f.tx - f.x, f.ty - f.y) < 20) {
        f.tx = rand(50, W - 50); f.ty = rand(SURFACE + 30, sandAt(f.tx) - 30 - s.len * s.tall);
        f.wanderAt = t + rand(3, 8);
      }
      var d = Math.hypot(f.tx - f.x, f.ty - f.y) || 1;
      ax += (f.tx - f.x) / d * want * 0.9; ay += (f.ty - f.y) / d * want * 0.5;
    }
    // schooling for tetras: stay together, match heading, keep a little room
    if (s.school) {
      var cx = 0, cy = 0, vx = 0, vy = 0, n = 0;
      fish.forEach(function (o) {
        if (o === f || !o.s.school) return;
        var dx = o.x - f.x, dy = o.y - f.y, d = Math.hypot(dx, dy);
        if (d < 110) { cx += o.x; cy += o.y; vx += o.vx; vy += o.vy; n++; }
        if (d < 16 && d > 0) { ax -= dx / d * 90; ay -= dy / d * 90; }
      });
      if (n) { ax += (cx / n - f.x) * 0.9 + (vx / n - f.vx) * 0.9; ay += (cy / n - f.y) * 0.9 + (vy / n - f.vy) * 0.9; }
    }
    // everyone keeps a little distance from bigger fish
    fish.forEach(function (o) {
      if (o === f) return;
      var dx = o.x - f.x, dy = o.y - f.y, d = Math.hypot(dx, dy), room = (o.s.len + f.s.len) * 0.45;
      if (d < room && d > 0) { ax -= dx / d * 60; ay -= dy / d * 60; }
    });
    // the glass, the surface and the sand
    var top = SURFACE + 16, bottom = sandAt(f.x) - 14 - s.len * s.tall * 0.5;
    if (f.x < 40) ax += (40 - f.x) * 6; if (f.x > W - 40) ax -= (f.x - (W - 40)) * 6;
    if (f.y < top) ay += (top - f.y) * 8; if (f.y > bottom) ay -= (f.y - bottom) * 8;

    f.vx += ax * dt; f.vy += ay * dt;
    var sp = Math.hypot(f.vx, f.vy), max = want * 1.3;
    if (sp > max) { f.vx *= max / sp; f.vy *= max / sp; }
    f.vy *= 1 - dt * 1.5; // fish swim mostly level
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.full = Math.max(0, f.full - dt * 0.02);
    f.fright = Math.max(0, f.fright - dt);
    // turning: the body narrows through side-on, as a fish seen from the glass does
    var goal = f.vx >= 0 ? 1 : -1;
    if (Math.abs(f.vx) > 4) f.face += clamp(goal - f.face, -dt * 3.2, dt * 3.2);
    f.tail += dt * (4 + Math.hypot(f.vx, f.vy) / s.speed * s.wiggle);
  }

  // ================================================================
  // Drawing. Realism comes from how water treats light: colour is lost
  // with depth (reds first), distance hazes and softens things toward the
  // water's colour, the surface focuses sunlight into moving caustics, and
  // the camera's shallow focus blurs what is very near or far.
  // ================================================================

  // ---- textures made once: sand grain, rock skin, fish scales, caustics
  function makeCanvas(w, h) { var k = document.createElement('canvas'); k.width = w; k.height = h; return k; }
  function hash(n) { return (Math.sin(n * 127.1) * 43758.5453) % 1; }

  // caustics: the bright web sunlight makes on the bottom; a tileable
  // cellular pattern, bright where two cells nearly meet
  function causticTile(seed) {
    var S = 192, k = makeCanvas(S, S), g = k.getContext('2d'), img = g.createImageData(S, S);
    var pts = [];
    for (var i = 0; i < 26; i++) pts.push([Math.abs(hash(seed + i * 1.7)) * S, Math.abs(hash(seed + i * 3.3 + 9)) * S]);
    for (var y = 0; y < S; y++) for (var x = 0; x < S; x++) {
      var d1 = 1e9, d2 = 1e9;
      for (var i = 0; i < pts.length; i++) for (var oy = -1; oy <= 1; oy++) for (var ox = -1; ox <= 1; ox++) {
        var dx = x - pts[i][0] - ox * S, dy = y - pts[i][1] - oy * S, d = dx * dx + dy * dy;
        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
      }
      var e = Math.sqrt(d2) - Math.sqrt(d1);
      var v = Math.max(0, 1 - e / 7); v = v * v * v;
      var o = (y * S + x) * 4;
      img.data[o] = 255; img.data[o + 1] = 250; img.data[o + 2] = 225; img.data[o + 3] = v * 255;
    }
    g.putImageData(img, 0, 0);
    return k;
  }
  var caustA = causticTile(1.3), caustB = causticTile(7.9);

  // fish scales: rows of overlapping arcs, used as a faint overlay
  var scaleTile = (function () {
    var k = makeCanvas(12, 10), g = k.getContext('2d');
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 0.8;
    for (var r = 0; r < 3; r++) for (var col = -1; col < 3; col++) {
      var x = col * 6 + (r % 2) * 3, y = r * 5;
      g.beginPath(); g.arc(x, y, 4, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    }
    return c.createPattern(k, 'repeat');
  })();

  // the static parts of the tank, drawn again only when the light or the size changes
  var sandLayer = null, backLayer = null, layerKey = '';
  function buildLayers(L) {
    var key = W + 'x' + H + ':' + L.deep.map(Math.round).join(',') + L.sand.map(Math.round).join(',');
    if (key === layerKey) return;
    layerKey = key;
    // the far wall of plants and stone, lost in haze
    backLayer = makeCanvas(W, H);
    var b = backLayer.getContext('2d');
    b.filter = 'blur(4px)';
    var haze = mixc(L.mid, L.deep, 0.35);
    for (var i = 0; i < 26; i++) {
      var x = (i / 26) * W + Math.abs(hash(i * 5.1)) * 30, h = H * (0.25 + Math.abs(hash(i * 2.3)) * 0.35);
      b.strokeStyle = rgb(mixc(haze, L.plant, 0.25)); b.lineWidth = 6 + Math.abs(hash(i)) * 8; b.lineCap = 'round';
      b.beginPath(); b.moveTo(x, H - 60); b.quadraticCurveTo(x + 18 * hash(i * 9), H - 60 - h * 0.5, x + 26 * hash(i * 4), H - 60 - h); b.stroke();
    }
    b.fillStyle = rgb(mixc(haze, [60, 64, 70], 0.2));
    b.beginPath(); b.moveTo(0, H);
    for (var x = 0; x <= W; x += 16) b.lineTo(x, H - 92 - Math.sin(x * 0.008 + 1) * 22 - Math.sin(x * 0.023) * 9);
    b.lineTo(W, H); b.fill();
    b.filter = 'none';

    // the sand: a shaded bank with grain and pebbles
    sandLayer = makeCanvas(W, H);
    var s = sandLayer.getContext('2d');
    s.beginPath(); s.moveTo(0, H);
    for (var x = 0; x <= W; x += 6) s.lineTo(x, sandAt(x));
    s.lineTo(W, H); s.closePath();
    var sg = s.createLinearGradient(0, H - 72, 0, H);
    sg.addColorStop(0, rgb(L.sand, 0.95)); sg.addColorStop(0.35, rgb(L.sand, 1)); sg.addColorStop(1, rgb(L.sand, 0.55));
    s.fillStyle = sg; s.fill();
    s.save(); s.clip();
    for (var i = 0; i < 9000; i++) {
      var x = Math.random() * W, y = H - 75 + Math.random() * 75, v = Math.random();
      s.fillStyle = v < 0.5 ? 'rgba(0,0,0,' + (0.05 + v * 0.1) + ')' : 'rgba(255,248,230,' + (v - 0.5) * 0.18 + ')';
      s.fillRect(x, y, 1, 1);
    }
    for (var i = 0; i < 70; i++) {
      var x = Math.random() * W, y = sandAt(x) + 6 + Math.random() * 50, r = 1.2 + Math.random() * 3.2, tone = 0.55 + Math.random() * 0.5;
      var pg = s.createRadialGradient(x - r * 0.3, y - r * 0.4, 0.2, x, y, r);
      pg.addColorStop(0, rgb(mixc(L.sand, [230, 225, 215], 0.4), tone * 1.1)); pg.addColorStop(1, rgb(mixc(L.sand, [90, 80, 70], 0.5), tone * 0.8));
      s.fillStyle = pg; s.beginPath(); s.ellipse(x, y, r * 1.3, r, 0, 0, 6.283); s.fill();
    }
    // ripples the current has left in the sand
    s.strokeStyle = 'rgba(0,0,0,0.06)'; s.lineWidth = 2;
    for (var i = 0; i < 14; i++) {
      var y0 = H - 50 + i * 4;
      s.beginPath();
      for (var x = 0; x <= W; x += 10) s.lineTo(x, y0 + Math.sin(x * 0.05 + i) * 2 + Math.sin(x * 0.013) * 5);
      s.stroke();
    }
    s.restore();
    // the shade where the bank meets the water behind it
    var edge = s.createLinearGradient(0, H - 72, 0, H - 40);
    edge.addColorStop(0, 'rgba(0,0,0,0.18)'); edge.addColorStop(1, 'rgba(0,0,0,0)');
  }
  function mixc(a, b, t) { return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
  function rgba(v, a) { return 'rgba(' + (v[0] | 0) + ',' + (v[1] | 0) + ',' + (v[2] | 0) + ',' + a + ')'; }

  // ---- a fish, facing right; the caller flips and tilts it.
  // Each species: body colours (back, flank, belly), a pattern drawn over
  // the flank, fin colour and the iris.
  var LOOKS_FISH = {
    clown: { back: [214, 78, 12], flank: [247, 118, 28], belly: [255, 170, 80], fin: [240, 110, 30], iris: [230, 120, 30] },
    tang: { back: [18, 44, 150], flank: [36, 92, 214], belly: [70, 140, 230], fin: [30, 60, 170], iris: [30, 30, 40] },
    angel: { back: [160, 160, 150], flank: [214, 212, 200], belly: [236, 232, 220], fin: [210, 206, 190], iris: [180, 40, 30] },
    tetra: { back: [120, 120, 110], flank: [200, 200, 190], belly: [220, 220, 215], fin: [210, 215, 220], iris: [200, 200, 210] },
  };

  function bodyPath(L, T) {
    // a fish's outline: blunt head, deepest a third back, narrowing to the tail
    c.beginPath();
    c.moveTo(L * 0.5, T * 0.04);
    c.bezierCurveTo(L * 0.49, -T * 0.34, L * 0.3, -T * 0.52, L * 0.05, -T * 0.5);
    c.bezierCurveTo(-L * 0.18, -T * 0.46, -L * 0.3, -T * 0.2, -L * 0.37, -T * 0.1);
    c.lineTo(-L * 0.37, T * 0.1);
    c.bezierCurveTo(-L * 0.3, T * 0.2, -L * 0.15, T * 0.46, L * 0.05, T * 0.48);
    c.bezierCurveTo(L * 0.3, T * 0.48, L * 0.46, T * 0.3, L * 0.5, T * 0.04);
    c.closePath();
  }
  // a translucent fin with rays, from a base to a tip outline
  function fin(points, colour, alpha, rays) {
    c.beginPath(); c.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) c.lineTo(points[i][0], points[i][1]);
    c.closePath();
    c.fillStyle = rgba(colour, alpha); c.fill();
    if (rays) {
      c.save(); c.clip();
      c.strokeStyle = rgba(mixc(colour, [0, 0, 0], 0.4), alpha * 0.8); c.lineWidth = 0.5;
      var base = points[0], n = points.length;
      for (var i = 1; i < n - 1; i++) { c.beginPath(); c.moveTo(base[0], base[1]); c.lineTo(points[i][0], points[i][1]); c.stroke(); }
      c.restore();
    }
  }
  function tailFin(L, T, swing, colour, alpha, fork) {
    c.save();
    c.translate(-L * 0.35, 0);
    c.rotate(swing);
    var spread = T * 0.55, len = L * 0.3;
    c.beginPath();
    c.moveTo(0, -T * 0.08);
    c.quadraticCurveTo(-len * 0.5, -spread * 0.6, -len, -spread);
    c.quadraticCurveTo(-len * (fork ? 0.62 : 0.85), 0, -len, spread);
    c.quadraticCurveTo(-len * 0.5, spread * 0.6, 0, T * 0.08);
    c.closePath();
    var g = c.createLinearGradient(0, 0, -len, 0);
    g.addColorStop(0, rgba(colour, alpha)); g.addColorStop(1, rgba(colour, alpha * 0.45));
    c.fillStyle = g; c.fill();
    c.save(); c.clip();
    c.strokeStyle = rgba(mixc(colour, [0, 0, 0], 0.35), alpha * 0.6); c.lineWidth = 0.5;
    for (var i = -4; i <= 4; i++) { c.beginPath(); c.moveTo(0, 0); c.lineTo(-len, (i / 4) * spread); c.stroke(); }
    c.restore();
    c.restore();
  }
  function eye(L, T, iris) {
    var x = L * 0.33, y = -T * 0.1, r = Math.max(1.6, T * 0.12);
    c.beginPath(); c.arc(x, y, r * 1.15, 0, 6.283); c.fillStyle = 'rgba(20,16,12,0.55)'; c.fill();
    var g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgb(iris, 0.5)); g.addColorStop(0.55, rgb(iris)); g.addColorStop(1, rgb(iris, 0.45));
    c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fillStyle = g; c.fill();
    c.beginPath(); c.arc(x + r * 0.08, y, r * 0.55, 0, 6.283); c.fillStyle = '#050505'; c.fill();
    c.beginPath(); c.arc(x - r * 0.25, y - r * 0.3, r * 0.22, 0, 6.283); c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
  }
  // gives a flat flank volume: a sheen up top, shade underneath and at the edges
  function shade(L, T) {
    var g = c.createLinearGradient(0, -T * 0.5, 0, T * 0.5);

    var L = look();
    buildLayers(L);

    // water: bright under the surface, losing light and warmth with depth
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(L.top)); g.addColorStop(0.35, rgb(L.mid)); g.addColorStop(1, rgb(L.deep));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // a brighter patch where the light enters, drifting
    var sunX = W * (0.4 + 0.08 * Math.sin(t * 0.05));
    var sg = c.createRadialGradient(sunX, -H * 0.1, 10, sunX, H * 0.1, W * 0.6);
    sg.addColorStop(0, 'rgba(230,250,255,' + 0.22 * (1 - L.dim) + ')'); sg.addColorStop(1, 'rgba(230,250,255,0)');
    c.fillStyle = sg; c.fillRect(0, 0, W, H);

    c.drawImage(backLayer, 0, 0);

    // shafts of light: soft, uneven, slowly swaying
    c.save(); c.globalCompositeOperation = 'lighter'; c.filter = 'blur(6px)';
    for (var i = 0; i < 9; i++) {
      var x = sunX + (i - 4) * W * 0.11 + Math.sin(t * 0.17 + i * 1.9) * 30;
      var w = 14 + 22 * Math.pow(Math.sin(i * 2.7 + t * 0.11), 2);
      var a = L.rays * (0.5 + 0.5 * Math.sin(t * 0.4 + i * 1.3));
      var rg = c.createLinearGradient(0, 0, 0, H * 0.85);
      rg.addColorStop(0, 'rgba(225,245,255,' + a + ')'); rg.addColorStop(1, 'rgba(225,245,255,0)');
      c.fillStyle = rg;
      var lean = (x - sunX) * 0.35;
      c.beginPath(); c.moveTo(x - w * 0.3, 0); c.lineTo(x + w * 0.3, 0); c.lineTo(x + lean + w, H * 0.85); c.lineTo(x + lean - w, H * 0.85); c.fill();
    }
    c.restore();

    plants.forEach(function (p) { if (!p.front) drawPlant(p, L, t, 0.35); });
    c.drawImage(sandLayer, 0, 0);
    drawWood(L);
    rocks.forEach(function (r) { drawRock(r, L); });

    // caustics on the sand, two webs drifting across each other
    c.save();
    c.beginPath(); c.moveTo(0, H);
    for (var x = 0; x <= W; x += 8) c.lineTo(x, sandAt(x) - 4);
    c.lineTo(W, H); c.clip();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.16 * (1 - L.dim);
    c.filter = 'blur(1.2px)';
    [[caustA, 9, 4, 0.9], [caustB, -6, 7, 0.7]].forEach(function (l) {
      var pat = c.createPattern(l[0], 'repeat');
      c.save();
      c.translate((t * l[1]) % 192, (t * l[2]) % 192);
      c.scale(l[3], l[3] * 0.45);
      c.fillStyle = pat;
      c.fillRect(-400, (H - 100) / (l[3] * 0.45) - 200, W / l[3] + 800, 600);
      c.restore();
    });
    c.restore();

    // food, sinking
    food.forEach(function (p) {
      p.sway += dt * 2; p.y += p.vy * dt; p.x += Math.sin(p.sway) * 6 * dt;
      var floor = sandAt(p.x) + 2;
      if (p.y > floor) { p.y = floor; p.settled = (p.settled || 0) + dt; }
      var fg = c.createRadialGradient(p.x - p.size * 0.3, p.y - p.size * 0.3, 0.2, p.x, p.y, p.size);
      fg.addColorStop(0, 'hsl(' + (p.hue + 10) + ',60%,' + (62 - L.dim * 20) + '%)'); fg.addColorStop(1, 'hsl(' + p.hue + ',70%,' + (32 - L.dim * 12) + '%)');
      c.fillStyle = fg; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.283); c.fill();
    });
    food = food.filter(function (p) { return !p.eaten && (p.settled || 0) < 14; });

    // fish, far to near, each with a soft shadow on the sand when low
    fish.forEach(function (f) { steer(f, dt, t); });
    fish.slice().sort(function (a, b) { return a.z - b.z; }).forEach(function (f) {
      var floor = sandAt(f.x), gap = floor - f.y;
      if (gap < 120) {
        var a = 0.16 * (1 - gap / 120) * (1 - L.dim), w = f.s.len * f.z * 0.55;
        var sh = c.createRadialGradient(f.x, floor + 4, 1, f.x, floor + 4, w);
        sh.addColorStop(0, 'rgba(0,0,0,' + a + ')'); sh.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = sh; c.beginPath(); c.ellipse(f.x, floor + 4, w, 4, 0, 0, 6.283); c.fill();
      }
      drawFish(f, L);
      // the water between us and a far fish
      var far = clamp((1.05 - f.z) / 0.27, 0, 1);
    });

    // a veil of water colour over everything, thicker lower down
    var veil = c.createLinearGradient(0, 0, 0, H);
    veil.addColorStop(0, rgba(L.mid, 0.0)); veil.addColorStop(1, rgba(L.deep, 0.18));
    c.fillStyle = veil; c.fillRect(0, 0, W, H);

    plants.forEach(function (p) { if (p.front) drawPlant(p, L, t, 0); });

    // bubbles: clear with a bright rim and a highlight
    if (bubbler && Math.random() < dt * 7) bubbles.push({ x: W * 0.93 + rand(-4, 4), y: sandAt(W * 0.93) - 4, r: rand(1.5, 4.5), wob: rand(0, 6.28), v: rand(45, 75) });
    bubbles.forEach(function (b) {
      b.y -= b.v * dt; b.wob += dt * 5; var x = b.x + Math.sin(b.wob) * 1.6;
      var bg = c.createRadialGradient(x, b.y, b.r * 0.4, x, b.y, b.r);
      bg.addColorStop(0, 'rgba(220,245,255,0.04)'); bg.addColorStop(0.85, 'rgba(220,245,255,0.18)'); bg.addColorStop(1, 'rgba(240,252,255,0.6)');
      c.fillStyle = bg; c.beginPath(); c.arc(x, b.y, b.r, 0, 6.283); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.arc(x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.22, 0, 6.283); c.fill();
    });
    bubbles = bubbles.filter(function (b) { return b.y > SURFACE; });

    // specks, drifting; the nearest ones large and blurred
    specks.forEach(function (s) {
      s.y -= dt * (0.004 + s.z * 0.006); s.x += Math.sin(t * 0.3 + s.ph) * dt * 0.004;
      if (s.y < 0) { s.y = 1; s.x = Math.random(); }
      var r = s.z > 0.93 ? 2.5 + s.z * 3 : 0.5 + s.z * 0.9;
      var a = (s.z > 0.93 ? 0.08 : 0.25 * s.z) * (1 - L.dim * 0.7);
      c.fillStyle = 'rgba(230,240,230,' + a + ')';
      c.beginPath(); c.arc(s.x * W, s.y * H, r, 0, 6.283); c.fill();
    });

    // rings where food lands and where the glass is tapped
    rings.forEach(function (r) {
      r.age += dt;
      var k = r.kind === 'tap' ? 1 : 0.5, rad = 8 + r.age * (r.kind === 'tap' ? 260 : 60);
      c.strokeStyle = 'rgba(220,245,255,' + Math.max(0, (0.4 - r.age * 0.6) * k) + ')';
      c.lineWidth = r.kind === 'tap' ? 2 : 1.2;
      c.beginPath(); c.arc(r.x, r.y, rad, 0, 6.283); c.stroke();
    });
    rings = rings.filter(function (r) { return r.age < 0.8; });

    // the surface from below: a bright, rippling mirror
    c.save();
    var surf = c.createLinearGradient(0, 0, 0, SURFACE + 14);
    surf.addColorStop(0, rgba(mixc(L.top, [255, 255, 255], 0.55), 0.8 - L.dim * 0.5)); surf.addColorStop(1, rgba(L.top, 0));
    c.fillStyle = surf;
    c.beginPath(); c.moveTo(0, 0);
    for (var x = 0; x <= W; x += 8) c.lineTo(x, SURFACE + Math.sin(x * 0.03 + t * 1.6) * 2.5 + Math.sin(x * 0.011 - t) * 2.5);
    c.lineTo(W, 0); c.fill();
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = 'rgba(255,255,255,' + 0.08 * (1 - L.dim) + ')'; c.lineWidth = 1; c.filter = 'blur(1px)';
    for (var j = 0; j < 3; j++) {
      c.beginPath();
      for (var x = 0; x <= W; x += 8) c.lineTo(x, SURFACE - 4 - j * 5 + Math.sin(x * (0.05 + j * 0.02) + t * (1.2 + j * 0.5)) * 2);
      c.stroke();
    }
    c.restore();

    // the lens: a soft vignette, deeper at night
    var v = c.createRadialGradient(W * 0.5, H * 0.45, H * 0.3, W * 0.5, H * 0.5, W * 0.72);
    v.addColorStop(0, 'rgba(0,4,10,0)'); v.addColorStop(1, 'rgba(0,4,10,' + (0.35 + L.dim * 0.5) + ')');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () { makePlants(); makeRocks(); layerKey = ''; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ink</title>
<!--
  Ectodeck's built-in Ink: Pavel Dobryakov's WebGL fluid simulation (MIT),
  with bloom and sun rays. A key press throws a burst of ink from that key;
  slow splashes keep it moving when nobody is pressing. The first dial
  turns the colours around the wheel.

  Built by scripts/build_backgrounds.py, which inlines the simulation from
  third_party/webgl-fluid; edit this source, not the built page.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "Glowing ink in water, from Pavel Dobryakov's WebGL fluid simulation (MIT). Each key press throws a burst of ink from that key; slow splashes keep it moving between presses.",
  "INPUTS": [
    { "NAME": "palette", "TYPE": "long", "LABEL": "Colours", "DEFAULT": 0, "VALUES": [0, 1, 2, 3], "LABELS": ["Rainbow", "Ember", "Ocean", "Ectonomic"] },
    { "NAME": "fade", "TYPE": "float", "LABEL": "Fade", "DEFAULT": 1, "MIN": 0.2, "MAX": 3 },
    { "NAME": "swirl", "TYPE": "float", "LABEL": "Swirl", "DEFAULT": 30, "MIN": 0, "MAX": 60 },
    { "NAME": "drift", "TYPE": "bool", "LABEL": "Drift between presses", "DEFAULT": true },
    { "NAME": "glow", "TYPE": "bool", "LABEL": "Glow", "DEFAULT": true }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script>/*FLUID*/</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var num = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  var flag = function (k) { return q.has(k) ? q.get(k) === '1' : !!declared[k]; };

  config.DENSITY_DISSIPATION = num('fade');
  config.CURL = num('swirl');
  config.BLOOM = config.BLOOM && flag('glow');
  config.SUNRAYS = config.SUNRAYS && flag('glow');
  config.SPLAT_RADIUS = 0.3;

  // colours: hues drawn from a palette, turned by the first dial
  var PALETTES = [null, [0.0, 0.05, 0.1, 0.13], [0.5, 0.55, 0.6, 0.65, 0.45], [0.2, 0.22, 0.25, 0.3, 0.15]];
  var palette = PALETTES[Math.round(num('palette'))] || null;
  var turn = 0;
  function hue() { return palette ? palette[Math.floor(Math.random() * palette.length)] : Math.random(); }
  function colour(h, strength) {
    var c = HSVtoRGB((h + turn + 1) % 1, 1, 1);
    return { r: c.r * strength, g: c.g * strength, b: c.b * strength };
  }

  // one colour per burst, so the ink stays that colour instead of mixing to white
  function burst(x, y, strength) {
    var n = 4, base = Math.random() * 6.283, h = hue();
    for (var i = 0; i < n; i++) {
      var a = base + (i / n) * 6.283 + (Math.random() - 0.5) * 0.6, f = 900 + Math.random() * 900;
      splat(x, y, Math.cos(a) * f, Math.sin(a) * f, colour(h + (Math.random() - 0.5) * 0.03, strength));
    }
  }
  window.addEventListener('ectodeck:press', function (e) {
    // the simulation measures from the bottom left
    if (e.detail.down) burst(e.detail.x, 1 - e.detail.y, 0.8);
  });
  window.addEventListener('ectodeck:dial', function (e) {
    if (e.detail.dial === 0) turn = (turn + e.detail.ticks * 0.04 + 1) % 1;
  });

  if (flag('drift')) {
    var next = 0;
    (function drift(now) {
      if (now > next) {
        var x = Math.random(), y = Math.random();
        splat(x, y, (Math.random() - 0.5) * 600, (Math.random() - 0.5) * 600, colour(hue(), 0.45));
        next = now + 1800 + Math.random() * 2600;
      }
      requestAnimationFrame(drift);
    })(0);
  }
  burst(0.5, 0.5, 0.7);
})();
</script>
</body>
</html>

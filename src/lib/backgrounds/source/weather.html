<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weather</title>
<!--
  Ectodeck's built-in Weather: Sky's sea of clouds, from Vanta (MIT, Teng
  Bao) on three.js (MIT), in the weather you choose and lit for the time of
  day. The weather is drawn after Apple's Weather app, in the clouds' own
  renderer straight after them, so the deck never catches it half drawn:
  soft rain streaks, snow, a drifting haze, lightning glowing inside the
  clouds, and at night the stars and the moon in its real phase.

  A key press does something in the weather there: a cloud puffs up, rain
  squalls across, snow gusts out, the fog parts, lightning strikes, or at
  night a shooting star falls.

  Built by scripts/build_backgrounds.py, which inlines the libraries from
  third_party; edit this source, not the built page.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "Weather: Sky's sea of clouds in the weather you choose, lit for the time of day, with rain, snow, fog, lightning, and at night the stars and the moon in its real phase. A key press does something in the weather there: a cloud puffs up, rain squalls across, snow gusts out, the fog parts, lightning strikes, or at night a shooting star falls. From Vanta (MIT) on three.js (MIT).",
  "INPUTS": [
    { "NAME": "weather", "TYPE": "long", "LABEL": "Weather", "DEFAULT": 0, "VALUES": [0, 1, 2, 3, 4, 5], "LABELS": ["Clear", "Cloudy", "Rain", "Thunderstorm", "Snow", "Fog"], "PRESET": true },
    { "NAME": "time", "TYPE": "long", "LABEL": "Time of day", "DEFAULT": -1, "VALUES": [-1, 0, 1, 2, 3], "LABELS": ["Automatic", "Morning", "Afternoon", "Sunset", "Night"] },
    { "NAME": "speed", "TYPE": "float", "LABEL": "Wind", "DEFAULT": 0.8, "MIN": 0.2, "MAX": 3 }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6a9ad6; }
  #sky { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<script>/*THREE*/</script>

      '    if (clearSky > 0.5) {',
      '      vec2 w = vec2(p.x * 0.8 - t * 0.004 * wind, uv.y * 3.2);',
      '      float n = fbm(w + vec2(fbm(w * vec2(0.4, 1.0) + 7.0) * 1.8, 0.0));',
      '      put(acc, vec3(0.3, 0.32, 0.52), smoothstep(0.5, 0.75, n) * smoothstep(0.2, 0.5, uv.y) * 0.2);',
      '    }',
      '    vec2 m = (p - mc) / mr; float md = length(p - mc);',
      '    float full = 0.35 + 0.65 * sin(phase * 3.14159);',
      '    float outside = smoothstep(mr * 0.85, mr * 1.0, md);',
      // the glow comes from the lit part: all round at full, from the bright edge of a crescent
      '    float sunSide = sin(phase * 6.28318);',
      '    float glowSide = mix(1.0, smoothstep(-0.7, 0.9, dot((p - mc) / max(md, 1e-4), vec2(sunSide > 0.0 ? 1.0 : -1.0, 0.0))), abs(sunSide));',
      '    add += vec3(0.6, 0.68, 0.95) * (exp(-max(md - mr, 0.0) * 14.0) * 0.22 + exp(-max(md - mr, 0.0) * 3.5) * 0.08 + exp(-md * 1.2) * 0.04) * full * outside * glowSide;',
      '    if (dot(m, m) < 1.1) {',
      '      float px = 1.5 / (mr * size.y);',
      '      float edge = smoothstep(1.0 + px * 1.5, 1.0 - px * 1.5, length(m));',
      '      vec3 photo = texture2D(moon, m * 0.47 + 0.5).rgb;',
      '      vec3 nrm = vec3(m, sqrt(max(1.0 - dot(m, m), 0.0)));',
      '      float a = phase * 6.28318;',
      '      float lit = smoothstep(-0.06, 0.08, dot(nrm, vec3(sin(a), 0.0, -cos(a))));',
      // seen through the air: its light is added to the sky rather than laid over it,
      // the sky's blue showing across it and filling its dark side; only the stars
      // behind it are hidden
      '      float luma = dot(photo, vec3(0.3, 0.59, 0.11));',
      '      vec3 face = mix(photo, vec3(luma), 0.15) * vec3(0.9, 0.94, 1.04) * lit * 1.05 * (1.0 + 0.12 * smoothstep(0.75, 1.0, length(m)));',
      // the dark part still faintly there in earthshine, so the phase reads as the moon's shape
      '      vec3 dim = mix(photo, vec3(luma), 0.4) * vec3(0.55, 0.62, 0.85) * 0.09 * (1.0 - lit);',
      '      add += (face + dim) * edge;',
      '      put(acc, vec3(0.0), edge * 0.3 * smoothstep(1.0, 0.8, length(m)));',
      '    }',
      '  }',
      // cloudy: high wisps drifting over, in the strip of sky above the cloud
      '  if (weather == 1) {',
      '    float w = fbm(vec2(p.x * 2.2 + t * 0.03 * wind, p.y * 7.0 + t * 0.01)) * fbm(vec2(p.x * 5.0 - t * 0.02 * wind, p.y * 12.0));',
      '    float wisp = smoothstep(0.18, 0.42, w) * smoothstep(0.45, 0.8, uv.y);',
      '    vec3 wc = mix(vec3(0.95, 0.96, 1.0), vec3(0.35, 0.38, 0.45), float(weather >= 2) * 0.7) * dim;',
      '    float wa = wisp * (weather == 1 ? 0.55 : 0.75);',
      '    put(acc, wc, wa);',
      '  }',
      // rain: soft slanting streaks of every length, falling past at three depths
      '  float lum = 0.35 + 0.65 * dot(cloudLight, vec3(0.33));',
      '  if (weather == 2 || weather == 3) {',
      '    float rain = weather == 3 ? 1.3 : 1.0;',
      '    for (int l = 0; l < 3; l++) {',
      '      float fl = float(l);',
      '      float slant = 0.12 + 0.12 * wind;',
      '      vec2 rq = vec2((p.x + uv.y * slant) * (70.0 - fl * 18.0), uv.y * (7.0 - fl * 1.8) + t * (13.0 - fl * 3.0));',
      '      vec2 cell = floor(rq); float r = hash(cell + fl * 11.0);',
      '      float y0 = hash(cell + 5.0 + fl) * 0.5, len = 0.22 + 0.3 * hash(cell + 2.2);',
      '      float fy = fract(rq.y) - y0;',
      '      float xoff = fract(rq.x) - 0.5 - (hash(cell + 9.0) - 0.5) * 0.7;',
      '      float streak = step(1.0 - 0.3 * rain, r) * smoothstep(0.12 + fl * 0.04, 0.0, abs(xoff)) * smoothstep(0.0, len * 0.6, fy) * smoothstep(len, len * 0.7, fy);',
      '      add += vec3(0.85, 0.9, 1.0) * streak * (0.07 + 0.06 * fl) * (0.6 + 0.4 * hash(cell + 4.4)) * lum;',
      '    }',
      '  }',
      // snow: flakes drifting down, the near ones big and soft
      '  if (weather == 4) {',
      '    for (int l = 0; l < 4; l++) {',
      '      float fl = float(l), sc = 26.0 - fl * 5.0;',
      '      vec2 sq = vec2(p.x * sc + sin(t * 0.4 + fl * 2.0 + uv.y * 3.0) * 0.8 * wind - t * 0.3 * wind, uv.y * sc + t * (0.9 + fl * 0.45));',
      '      vec2 cell = floor(sq), f = fract(sq) - 0.5; float r = hash(cell + fl * 7.0);',
      '      vec2 o = vec2(hash(cell + 1.7) - 0.5, hash(cell + 2.9) - 0.5) * 0.5 + vec2(sin(t * 1.1 + r * 30.0), cos(t * 0.9 + r * 20.0)) * 0.12;',
      '      float rad = 0.05 + fl * 0.03, soft = 0.25 + fl * 0.22;',
      '      add += vec3(1.0) * step(0.7 + fl * 0.06, r) * smoothstep(rad, rad * (1.0 - soft) * 0.4, length(f - o)) * (0.75 - fl * 0.12) * lum;',
      '    }',
      '  }',
      // storms: lightning glowing inside the clouds, now and then, flickering as it dies
      '  float glow = 0.0;',
      '  if (weather == 3) {',
      '    float n = floor(t / 3.7), at = fract(t / 3.7) * 3.7;',
      '    if (hash(vec2(n, 3.0)) > 0.3) {',
      '      float a = at - hash(vec2(n, 4.0)) * 1.5;',
      '      if (a > 0.0) {',
      '        float f = exp(-a * 5.0) * (0.55 + 0.45 * step(0.5, fract(a * 11.0))) + 0.6 * exp(-max(a - 0.18, 0.0) * 9.0) * step(0.18, a);',
      // in the cloud overhead
      '        vec2 c = vec2((0.15 + 0.7 * hash(vec2(n, 1.0))) * aspect, 0.5 + 0.35 * hash(vec2(n, 2.0)));',
      '        float billow = smoothstep(0.25, 0.75, fbm(vec2(p.x * 3.0 + n * 7.0, uv.y * 5.0)));',
      '        glow += f * (exp(-length((p - c) * vec2(0.8, 1.6)) * 2.2) * (0.5 + 1.2 * billow) + 0.12);',
      '      }',
      '    }',
      '  }',
      // ---- presses
      '  float part = 0.0;',
      '  for (int i = 0; i < 8; i++) {',
      '    vec4 k = presses[i]; if (k.z < 0.0) continue;',
      '    vec2 kp = vec2(k.x * aspect, k.y); float age = k.z; vec2 d = p - kp;',
      // a storm: lightning flares in the cloud at the key, and a bolt strikes down to it
      '    if (weather == 3 && age < 0.9) {',
      '      float flick = 0.55 + 0.45 * step(0.5, fract(age * 16.0));',
      '      float billow = smoothstep(0.2, 0.75, fbm(vec2(p.x * 3.2 + k.w, uv.y * 5.5 - age)));',
      '      glow += (1.0 - smoothstep(0.0, 0.9, age)) * flick * (exp(-length(d * vec2(0.6, 1.3)) * 3.2) * (0.4 + 1.5 * billow) + 0.12);',
      '      if (uv.y > kp.y && age < 0.35) {',
      '        float jag = kp.x + (noise(vec2(uv.y * 9.0, k.w)) - 0.5) * 0.12 + (noise(vec2(uv.y * 40.0, k.w + 3.0)) - 0.5) * 0.03;',
      '        float dx = abs(p.x - jag), life = (1.0 - age / 0.35) * (0.6 + 0.4 * step(0.5, fract(age * 18.0)));',
      '        add += vec3(0.88, 0.92, 1.0) * (exp(-dx * 500.0) * 1.6 + exp(-dx * 40.0) * 0.25) * life;',
      '      }',
      '    }',
      // clear and cloudy days: a soft cloud puffs up at the key, rises and thins away
      '    if ((weather == 0 || weather == 1) && night < 0.5 && age < 5.0) {',
      '      float grow = 1.0 - exp(-age * 2.5), rad = 0.1 + 0.14 * grow;',
      '      vec2 c = kp + vec2(age * 0.015 * wind, age * 0.018);',
      '      vec2 r = (p - c) / rad; r.y *= 1.35;',
      '      float lumps = fbm(r * 1.3 + k.w + vec2(t * 0.15, 0.0));',
      '      float body = smoothstep(1.15, 0.55, length(r) + (0.5 - lumps) * 0.9);',
      '      float fade = smoothstep(0.0, 0.3, age) * (1.0 - smoothstep(2.0, 5.0, age));',
      '      float thin = smoothstep(0.35 + 0.4 * smoothstep(2.0, 5.0, age), 0.8, lumps + body * 0.4);',
      '      float a = body * thin * fade * 0.95;',
      // lit from above, shadowed underneath, in the clouds' own light
      '      vec3 pc = mix(mix(cloudLight * 0.7, vec3(0.55, 0.47, 0.66), dusk), mix(vec3(1.0, 0.99, 0.97), vec3(1.0, 0.76, 0.7), dusk), smoothstep(-0.8, 0.9, r.y + lumps * 0.8));',
      '      put(acc, pc, a);',
      '    }',
      // night (clear or cloudy): a shooting star falls from the key
      '    if ((weather == 0 || weather == 1) && night > 0.5 && age < 1.2) {',
      '      vec2 dir = normalize(vec2(fract(k.w) > 0.5 ? 1.0 : -1.0, -0.45));',
      '      vec2 head = kp + dir * age * 0.7;',
      '      vec2 r = p - head; float along = dot(r, -dir), across = abs(dot(r, vec2(-dir.y, dir.x)));',
      '      float trail = step(0.0, along) * exp(-along * 7.0) * exp(-across * 700.0);',
      '      float life = smoothstep(0.0, 0.1, age) * (1.0 - smoothstep(0.7, 1.2, age));',
      '      add += vec3(0.95, 0.97, 1.0) * (trail * 1.4 + exp(-length(r) * 90.0) * 1.2) * life;',
      '    }',
      // rain: drops splash onto the glass at the key, bead up catching the light,
      // then run down the glass one by one, leaving wet trails, and dry away
      '    if (weather == 2 && age < 6.0) {',
      '      for (int j = 0; j < 18; j++) {',
      '        float fj = float(j), h1 = hash(vec2(k.w, fj)), h2 = hash(vec2(fj, k.w + 5.0)), h3 = hash(vec2(fj + 9.0, k.w));',
      '        vec2 start = kp + (vec2(h1, h2) - 0.5) * vec2(0.26, 0.2);',
      '        float rad = 0.014 + 0.032 * h3 * h3;',
      '        float wait = 0.25 + 1.6 * h2, run = max(age - wait, 0.0);',
      '        vec2 c = start - vec2(sin(run * 3.0 + fj) * 0.004, run * run * (0.03 + 0.07 * h3));',
      '        float life = smoothstep(0.0, 0.07, age) * (1.0 - smoothstep(4.0, 6.0, age));',
      '        vec2 dq = (p - c) / vec2(1.0, 1.0 + 0.25 * smoothstep(0.0, 0.4, run));',
      '        float dd = length(dq);',
      '        float body = smoothstep(rad, rad * 0.82, dd);',
      '        float rim = body - smoothstep(rad * 0.86, rad * 0.55, dd);',
      '        float shine = exp(-length(dq - vec2(-0.32, 0.36) * rad) / (rad * 0.16));',
      '        float trail = step(c.y, p.y) * step(p.y, start.y) * smoothstep(rad * 0.45, rad * 0.1, abs(p.x - c.x - sin((p.y - start.y) * 60.0 + fj) * 0.003)) * smoothstep(0.0, 0.3, run);',
      // mostly clear: a thin dark edge high up, the sky's light bent into a bright
      // crescent low in the drop, and a small glint on top
      '        float crescent = body * smoothstep(0.1, 0.85, -dq.y / rad) * smoothstep(1.0, 0.6, dd / rad);',
      '        float edgeTop = rim * smoothstep(-0.3, 0.6, dq.y / rad);',
      '        put(acc, vec3(0.0), edgeTop * 0.3 * life);',
      '        add += (cloudLight * crescent * 0.35 + vec3(1.0) * shine * 0.8 * body + cloudLight * body * 0.05 + cloudLight * trail * 0.08) * life * lum;',
      '      }',
      '    }',
      // snow: a gust sweeping out of the key with the wind, each flake at its
      // own speed and height, so it scatters rather than rings
      '    if (weather == 4 && age < 2.2) {',
      '      for (int j = 0; j < 22; j++) {',
      '        float fj = float(j), h1 = hash(vec2(k.w, fj)), h2 = hash(vec2(fj, k.w + 2.0)), h3 = hash(vec2(fj + 5.0, k.w));',
      '        float a = (h1 - 0.5) * 1.6 + 0.15, v = 0.08 + 0.28 * h2, go = age * (1.0 - 0.25 * age / 2.2);',
      '        vec2 at = kp + vec2((h3 - 0.5) * 0.06, (h1 - 0.5) * 0.08) + vec2(cos(a), sin(a) * 0.6) * v * go + vec2(sin(age * 3.0 + fj) * 0.01, -age * age * 0.04);',
      '        add += vec3(0.95, 0.97, 1.0) * smoothstep(0.011, 0.002, length(p - at)) * 0.85 * smoothstep(0.0, 0.1, age) * (1.0 - smoothstep(1.2, 2.2, age)) * (0.5 + 0.5 * h3) * lum;',
      '      }',
      '    }',
      // fog: it parts around the key, then closes again
      '    if (weather == 5 && age < 6.0) {',
      '      float open = smoothstep(0.0, 0.8, age) * (1.0 - smoothstep(2.5, 6.0, age));',
      '      float rr = 0.16 + 0.22 * smoothstep(0.0, 2.0, age);',
      '      part = max(part, open * smoothstep(rr, rr * 0.3, length(d * vec2(1.0, 1.4)) + (fbm(p * 7.0 + k.w) - 0.5) * 0.08));',
      '    }',
      '  }',
      // fog: inside the cloud, everything softened into haze that moves, thinner where a key parted it
      '  if (weather == 5) {',
      '    float h = 0.55 + 0.3 * fbm(vec2(p.x * 1.4 + t * 0.04 * wind, uv.y * 2.5 + t * 0.02));',
      '    float fa = h * 0.85 * (1.0 - part);',
      '    put(acc, mix(vec3(0.9, 0.92, 0.95), vec3(0.2, 0.22, 0.28), night), fa);',
      '  }',
      '  vec3 light = vec3(0.8, 0.85, 1.0) * glow;',
      '  gl_FragColor = vec4(acc.rgb + add + light + (hash(gl_FragCoord.xy) - 0.5) / 255.0, acc.a);',
      '}'
    ].join('\n'),
    // the layer's own colour is added; its cover veils what is behind
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    depthTest: false, depthWrite: false, transparent: true
  });
  var layerScene = new THREE.Scene(), layerCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  layerScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), layer));
  // The clouds and the weather are drawn into a hidden picture first and
  // copied to the screen in one step, so the screen only ever holds a
  // finished frame, as the Aquarium does: drawn straight onto it, pass by
  // pass, the deck's headless Chrome can take a frame part-way, with the
  // weather missing.
  var renderer = effect.renderer, drawScene = renderer.render.bind(renderer);
  var finished = null, bufferSize = new THREE.Vector2();
  var copyMaterial = new THREE.ShaderMaterial({
    uniforms: { map: { value: null } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D map; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(map, vUv).rgb, 1.0); }',
    depthTest: false, depthWrite: false
  });
  var copyScene = new THREE.Scene();
  copyScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), copyMaterial));
  renderer.render = function (scene, camera) {
    renderer.getDrawingBufferSize(bufferSize);
    if (!finished || finished.width !== bufferSize.x || finished.height !== bufferSize.y) {
      if (finished) finished.dispose();
      finished = new THREE.WebGLRenderTarget(bufferSize.x, bufferSize.y, { depthBuffer: false });
      copyMaterial.uniforms.map.value = finished.texture;
    }
    renderer.setRenderTarget(finished);
    drawScene(scene, camera);
    var now = performance.now() / 1000;
    slots.forEach(function (slot, i) { var b = presses[i]; if (b) slot.set(b.x, b.y, now - b.at, b.seed); else slot.z = -1; });
    layer.uniforms.t.value = now;
    layer.uniforms.skyTime.value = effect.uniforms.iTime.value;
    var res = effect.uniforms.iResolution.value, mouse = effect.uniforms.iMouse.value;
    if (res.x > 0) layer.uniforms.skyMouse.value.set(mouse.x / res.x, mouse.y / res.y);
    layer.uniforms.size.value.set(innerWidth, innerHeight);
    layer.uniforms.ratio.value = renderer.getPixelRatio();
    var keep = renderer.autoClear; renderer.autoClear = false;
    drawScene(layerScene, layerCamera);
    // then the finished frame onto the screen, whole; it covers every pixel, so no clear
    renderer.setRenderTarget(null);
    drawScene(copyScene, layerCamera);
    renderer.autoClear = keep;
  };
  function relight() {
    var l = look(time);
    effect.setOptions(Object.assign(l, { speed: pace() }));
    layer.uniforms.night.value = time === 3 ? 1 : 0;
    layer.uniforms.weather.value = weather;
    layer.uniforms.cloudLight.value.set(l.cloudColor);
    layer.uniforms.under.value = under() ? 1 : 0;
    layer.uniforms.lookAt.value = l.lookAt; layer.uniforms.swing.value = l.swing; layer.uniforms.sunHeight.value = l.sunHeight;
    layer.uniforms.sunColor.value.set(l.sunColor); layer.uniforms.dusk.value = time === 2 ? 1 : 0;
  }

  // a new weather, time of day or wind arrives in place, so the clouds keep
  // drifting; any other setting starts the page again with the new address
  var startQuery = location.search;
  window.addEventListener('ectodeck:params', function (e) {
    var p = e.detail, now = new URLSearchParams(location.search), was = new URLSearchParams(startQuery);
    var keys = Array.from(now.keys()).concat(Array.from(was.keys()));
    for (var i = 0; i < keys.length; i++) if (['time', 'speed', 'weather'].indexOf(keys[i]) < 0 && now.get(keys[i]) !== was.get(keys[i])) return location.reload();
    if (p.time !== undefined) { timeSetting = Math.round(p.time); time = timeSetting < 0 ? clockTime() : timeSetting % 4; }
    if (p.speed !== undefined) { base = Number(p.speed); layer.uniforms.wind.value = base; }
    if (p.weather !== undefined) weather = Math.round(p.weather) % 6;
    relight();
  });
  setInterval(function () {
    layer.uniforms.phase.value = moonPhase();
    if (timeSetting < 0 && clockTime() !== time) { time = clockTime(); relight(); }
  }, 60000);
})();
</script>

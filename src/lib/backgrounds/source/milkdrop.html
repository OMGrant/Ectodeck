<style>

<body>
<canvas id="viz" aria-hidden="true"></canvas>
<script>/*BUTTERCHURN*/</script>
<script>/*BUTTERCHURN_PRESETS*/</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var num = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  var every = num('every'), baseEvery = every, blend = num('blend');
  var shuffle = q.has('shuffle') ? q.get('shuffle') === '1' : declared.shuffle;
  var chosen = Math.round(num('preset'));   // 0: changing on its own; otherwise that look

  var engine = window.butterchurn.default || window.butterchurn;
  var pack = window.butterchurnPresets.default || window.butterchurnPresets;
  var presets = pack.getPresets();
  var names = Object.keys(presets);
  var first = chosen > 0 ? names[chosen - 1] : null;
  if (shuffle && !first) for (var i = names.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = names[i]; names[i] = names[j]; names[j] = t; }

  var canvas = document.getElementById('viz');
  // many presets run bright; a little less keeps the keys' icons readable
  canvas.style.filter = 'brightness(' + num('brightness') + ')';
  var W = window.innerWidth, H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  var audio = new (window.AudioContext || window.webkitAudioContext)();
  var viz = engine.createVisualizer(audio, canvas, { width: W, height: H, pixelRatio: 1, textureRatio: 1 });
  window.addEventListener('resize', function () { W = window.innerWidth; H = window.innerHeight; canvas.width = W; canvas.height = H; viz.setRendererSize(W, H); });

  var index = 0, changedAt = performance.now();
  function show(i, seconds) {
    index = (i + names.length) % names.length;
    viz.loadPreset(presets[names[index]], seconds);
    changedAt = performance.now();
  }
  if (first) { every = 0; names.splice(names.indexOf(first), 1); names.unshift(first); }
  show(0, 0);

  // the sound, from Ectodeck; silence until the first event arrives
  var wave = new Uint8Array(1024).fill(128);
  window.addEventListener('ectodeck:audio', function (e) {
    var w = e.detail.wave;
    if (!w) return;
    for (var i = 0; i < 1024 && i < w.length; i++) wave[i] = w[i];
  });
  // a press is a beat: a thump of bass in the sound the visualiser hears
  var beatAt = -1e9;
  window.addEventListener('ectodeck:press', function (e) { if (e.detail.down) beatAt = performance.now(); });
  // a chosen preset blends in without restarting the music, and Random goes back to changing on its own; any other
  // setting starts the page again with the new address, already in place
  var startQuery = location.search;
  window.addEventListener('ectodeck:params', function (e) {
    var p = e.detail, now = new URLSearchParams(location.search), was = new URLSearchParams(startQuery);
    var keys = Array.from(now.keys()).concat(Array.from(was.keys()));
    for (var i = 0; i < keys.length; i++) if (['preset', 'every', 'blend', 'brightness'].indexOf(keys[i]) < 0 && now.get(keys[i]) !== was.get(keys[i])) return location.reload();
    if (p.blend !== undefined) blend = Number(p.blend);
    if (p.brightness !== undefined) canvas.style.filter = 'brightness(' + p.brightness + ')';
    if (p.every !== undefined) baseEvery = Number(p.every);
    var n = p.preset !== undefined ? Math.round(p.preset) : chosen;
    if (n > 0) { every = 0; if (n !== chosen) show(names.indexOf(Object.keys(presets)[n - 1]), Math.min(blend, 1)); }
    else { every = baseEvery; if (chosen > 0) show(index + 1, Math.min(blend, 1)); }
    chosen = n;
  });

  var mixed = new Uint8Array(1024);
  function frame(now) {
    if (every > 0 && now - changedAt > every * 1000) show(index + 1, blend);
    // the thump: a decaying 50 Hz swell added to whatever is playing
    var since = (now - beatAt) / 1000, thump = since < 0.45 ? Math.exp(-since * 7) : 0;
    for (var i = 0; i < 1024; i++) mixed[i] = Math.max(0, Math.min(255, wave[i] + thump * 120 * Math.sin(i * 0.014 + since * 300)));
    viz.render({ audioLevels: { timeByteArray: mixed, timeByteArrayL: mixed, timeByteArrayR: mixed } });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>

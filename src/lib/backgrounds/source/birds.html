<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Birds</title>
<!--
  Ectodeck's built-in Birds: a flock at dusk, from Vanta (MIT, Teng Bao) on
  three.js (MIT). The flock steers away from a pressed key, as it does from
  a pointer on the web. The first dial changes the size of the flock.

  Built by scripts/build_backgrounds.py, which inlines the libraries from
  third_party; edit this source, not the built page.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "A flock of birds wheeling through the dusk. Press a key and the flock swerves away from it. From Vanta (MIT) on three.js (MIT).",
  "INPUTS": [
    { "NAME": "sky", "TYPE": "color", "LABEL": "Sky", "DEFAULT": [0.05, 0.06, 0.14, 1] },
    { "NAME": "colour1", "TYPE": "color", "LABEL": "Birds", "DEFAULT": [1.0, 0.45, 0.25, 1] },
    { "NAME": "colour2", "TYPE": "color", "LABEL": "Birds, second", "DEFAULT": [0.3, 0.7, 1.0, 1] },
    { "NAME": "flock", "TYPE": "float", "LABEL": "Flock size", "DEFAULT": 3, "MIN": 1, "MAX": 5 },
    { "NAME": "size", "TYPE": "float", "LABEL": "Bird size", "DEFAULT": 1.4, "MIN": 0.5, "MAX": 3 }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e24; }
  #sky { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<script>/*THREE*/</script>
<script>/*VANTA_BIRDS*/</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var num = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  var hex = function (k) {
    var v = q.has(k) ? q.get(k).split(',').map(parseFloat) : declared[k];
    return (Math.round(v[0] * 255) << 16) | (Math.round(v[1] * 255) << 8) | Math.round(v[2] * 255);
  };
  var options = function (quantity) {
    return {
      el: '#sky', THREE: THREE, mouseControls: true, touchControls: false, gyroControls: false,
      backgroundColor: hex('sky'), color1: hex('colour1'), color2: hex('colour2'), colorMode: 'varianceGradient',
      birdSize: num('size'), wingSpan: 25, speedLimit: 4, separation: 30, alignment: 30, cohesion: 30,
      quantity: quantity,
    };
  };
  var quantity = Math.round(num('flock'));
  var effect = VANTA.BIRDS(options(quantity));

  // a press: the pointer goes to the key for a moment, and the flock avoids it
  var away;
  window.addEventListener('ectodeck:press', function (e) {
    if (!e.detail.down) return;
    var x = e.detail.x * innerWidth, y = e.detail.y * innerHeight;
    for (var i = 0; i < 3; i++) window.dispatchEvent(new MouseEvent('mousemove', { clientX: x + i, clientY: y }));
    clearTimeout(away);
    away = setTimeout(function () { window.dispatchEvent(new MouseEvent('mousemove', { clientX: -9999, clientY: -9999 })); }, 1600);
  });
  window.addEventListener('ectodeck:dial', function (e) {
    if (e.detail.dial !== 0) return;
    quantity = Math.max(1, Math.min(5, quantity + (e.detail.ticks > 0 ? 1 : -1)));
    effect.destroy();
    effect = VANTA.BIRDS(options(quantity));
  });
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aquarium</title>
<!--
  Ectodeck's built-in Aquarium: looking through the front glass into a deep
  reef tank, lit from above, drawn with three.js (MIT). The backdrop, fish,
  bubble and food are photographic images made for Ectodeck. A key press
  drops food there and the fish come to eat; two quick presses tap the
  glass and the fish nearby dart away (a pufferfish puffs up). A crab
  scuttles about the sand, comes to eat the food that settles there, and
  scurries off from a tap on the glass; a sea anemone
  sways at the foot of the rocks and draws in when touched. With music the
  crab side-steps and hops to the beat, the anemone's tentacles swing in
  time, and the pufferfish swells on each beat. At night the dance gets a
  disco: coloured spots, turning sparkles and two spotlight beams on the beat. The fish swim as in water: a tail
  thrusts them along their nose and the water slows them. With music
  playing the whole tank dances to one beat: every nose angles up on one
  beat and down on the next, so the fish swim in arcs together, and at the
  start of each phrase (every few seconds) the kinds turn in turn (big fish, then
  striped, then small) until all swim one way. Each kind kicks its tail on
  its own part of the music: the big fish on the bass, the striped fish on
  the middle, the small fish on the highs. On a big drop the school
  gathers and swirls. Its presets are the time of day.

  Built by scripts/build_backgrounds.py, which inlines three.js and the
  pictures in aquarium/; edit this source, not the built page.
-->
<script type="application/json" id="ectodeck-inputs">
{
  "DESCRIPTION": "Looking into a deep reef tank lit from above, with clownfish, tangs, an angelfish, Moorish idols and more. Press a key to feed the fish there; press it twice quickly to tap the glass. Play music and the fish dance to it. Its presets are the time of day, or Automatic to follow your clock.",
  "INPUTS": [
    { "NAME": "time", "TYPE": "long", "LABEL": "Light", "DEFAULT": 0, "VALUES": [-1, 0, 1, 2], "LABELS": ["Automatic", "Day", "Dusk", "Night"], "PRESET": true },
    { "NAME": "dance", "TYPE": "bool", "LABEL": "Dance to music", "DEFAULT": true },
    { "NAME": "energy", "TYPE": "float", "LABEL": "Dance energy", "DEFAULT": 1, "MIN": 0.3, "MAX": 1.6 },
    { "NAME": "disco", "TYPE": "long", "LABEL": "Disco lights", "DEFAULT": 1, "VALUES": [0, 1, 2], "LABELS": ["Off", "At night", "Always"] },
    { "NAME": "speed", "TYPE": "float", "LABEL": "Swim speed", "DEFAULT": 1, "MIN": 0.4, "MAX": 1.8 },
    { "NAME": "fish", "TYPE": "float", "LABEL": "Fish", "DEFAULT": 1, "MIN": 0.3, "MAX": 2 },
    { "NAME": "puffer", "TYPE": "bool", "LABEL": "Pufferfish", "DEFAULT": true },
    { "NAME": "crab", "TYPE": "bool", "LABEL": "Crab", "DEFAULT": true },
    { "NAME": "anemone", "TYPE": "bool", "LABEL": "Sea anemone", "DEFAULT": true },
    { "NAME": "bubbles", "TYPE": "bool", "LABEL": "Bubbles", "DEFAULT": true }
  ]
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06243f; }
  canvas { display: block; }
</style>
</head>
<body>
<script>/*THREE*/</script>
<script>
(function () {
  // ---- settings, from the address or the declared defaults
  var q = new URLSearchParams(location.search);
  var declared = {};
  JSON.parse(document.getElementById('ectodeck-inputs').textContent).INPUTS.forEach(function (i) { declared[i.NAME] = i.DEFAULT; });
  var setting = function (k) { return q.has(k) ? parseFloat(q.get(k)) : Number(declared[k]); };
  var bubbler = q.has('bubbles') ? q.get('bubbles') === '1' : declared.bubbles;
  var dancing = q.has('dance') ? q.get('dance') === '1' : declared.dance;
  var flag = function (k) { return q.has(k) ? q.get(k) === '1' : declared[k]; };
  var truthy = function (v) { return !!v && v !== '0' && v !== 'false'; };
  var energy = Math.min(1.6, Math.max(0.3, setting('energy')));
  var discoMode = Math.round(setting('disco'));          // 0 off, 1 at night, 2 always
  var swimSpeed = Math.min(1.8, Math.max(0.4, setting('speed')));
  var showPuffer = flag('puffer'), showCrab = flag('crab'), showAnemone = flag('anemone');
  var fishScale = Math.min(2, Math.max(0.3, setting('fish')));
  function sunHours(now) {
    var y = now.getFullYear(), jan = new Date(y, 0, 1).getTimezoneOffset(), jul = new Date(y, 6, 1).getTimezoneOffset();
    var lat = (jan < jul ? -35 : 35) * Math.PI / 180;
    var noon = 12 + (now.getTimezoneOffset() < Math.max(jan, jul) ? 1 : 0);
    var day = (now - new Date(y, 0, 0)) / 864e5;
    var decl = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI / 365 * (day + 10));
    var cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(lat) * Math.sin(decl)) / (Math.cos(lat) * Math.cos(decl));
    var half = Math.acos(Math.max(-1, Math.min(1, cosH))) * 12 / Math.PI;
    return { now: now.getHours() + now.getMinutes() / 60, rise: noon - half, noon: noon, set: noon + half };
  }
  function clockLight() {
    var s = sunHours(new Date());
    if (s.now < s.rise - 0.5 || s.now >= s.set + 0.75) return 2;
    if (s.now < s.rise + 0.75 || s.now >= s.set - 1) return 1;
    return 0;
  }
  // the chosen time of day, or -1 to follow the clock
  var timeSetting = Math.round(setting('time'));
  var light = timeSetting < 0 ? clockLight() : timeSetting % 3;   // 0 day, 1 dusk, 2 night
  setInterval(function () { if (timeSetting < 0) light = clockLight(); }, 60000);
  // the tank's light for each: its colour over everything, and how strong the rays are
  var LIGHTS = [{ tint: [1, 1, 1], rays: 1 }, { tint: [0.86, 0.66, 0.56], rays: 0.55 }, { tint: [0.26, 0.34, 0.6], rays: 0.12 }];
  var tint = new THREE.Vector3().fromArray(LIGHTS[light].tint), rayAmount = { value: LIGHTS[light].rays };

  var W = innerWidth, H = innerHeight;
  // The canvas keeps each frame until the next is drawn: without it the
  // deck's headless Chrome now and then shows a frame with the backdrop
  // missing, which flickers on the deck.
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  // pixels, with y up from the bottom
  var camera = new THREE.OrthographicCamera(0, W, H, 0, -1000, 1000);
  var loader = new THREE.TextureLoader();
  var clock = { t: 0 };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  // the tank's deep blue, which far and low fish sink into
  var WATER = new THREE.Vector3(0.02, 0.09, 0.22);

  // ---- the reef: the photograph, with light rippling over it and the surface moving
  var reefMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: loader.load('ectodeck-asset:aquarium/reef.webp') }, t: { value: 0 }, tint: { value: tint } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform sampler2D map; uniform float t; uniform vec3 tint; varying vec2 vUv;',
      'void main() {',
      '  vec2 uv = vUv;',
      // the surface, in the top quarter, moves: a slow wobble that fades out downward
      '  float top = smoothstep(0.72, 0.95, uv.y);',
      '  uv.x += top * 0.006 * sin(uv.y * 70.0 + t * 1.3) + top * 0.004 * sin(uv.x * 23.0 - t * 0.9);',
      '  uv.y += top * 0.004 * sin(uv.x * 31.0 + t * 1.1);',
      '  vec3 c = texture2D(map, uv).rgb;',
      // caustics: bright wandering webs, strongest low down on the sand and coral
      '  vec2 p = vUv * vec2(9.0, 5.0);',
      '  float w = sin(p.x * 1.7 + t * 0.9 + sin(p.y * 1.3 + t * 0.7) * 1.6) * sin(p.y * 2.1 - t * 0.8 + sin(p.x * 1.1 - t * 0.5) * 1.4);',
      '  float caust = pow(max(w, 0.0), 6.0) + 0.6 * pow(max(sin((p.x + p.y) * 2.3 + t * 1.2 + sin(p.x * 3.0) ), 0.0), 12.0);',
      '  float low = 1.0 - smoothstep(0.35, 0.7, vUv.y);',
      '  float lum = dot(c, vec3(0.3, 0.55, 0.15));',
      '  c += caust * low * (0.10 + 0.25 * lum) * vec3(0.8, 0.95, 1.0);',
      '  gl_FragColor = vec4(c * tint, 1.0);',
      '}'
    ].join('\n'),
    depthTest: false, depthWrite: false
  });
  var reef = new THREE.Mesh(new THREE.PlaneBufferGeometry(1, 1), reefMat);
  reef.scale.set(W, H, 1); reef.position.set(W / 2, H / 2, -500);
  reef.renderOrder = 0;
  scene.add(reef);

  // ---- light rays from the surface, swaying slowly
  var rayMat = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, amount: rayAmount },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform float t; uniform float amount; varying vec2 vUv;',
      'void main() {',
      '  float x = vUv.x;',
      '  float a = 0.0;',
      '  for (int i = 0; i < 6; i++) {',
      '    float fi = float(i);',
      '    float cx = 0.12 + fi * 0.16 + 0.03 * sin(t * 0.21 + fi * 1.7) + (1.0 - vUv.y) * (0.08 * sin(fi * 2.3));',
      '    float wdt = 0.018 + 0.012 * sin(fi * 3.1 + 1.0) + (1.0 - vUv.y) * 0.03;',
      '    a += exp(-pow((x - cx) / wdt, 2.0)) * (0.55 + 0.45 * sin(t * 0.37 + fi * 2.1));',
      '  }',
      '  a *= smoothstep(0.1, 0.95, vUv.y) * 0.06 * amount;',
      '  gl_FragColor = vec4(vec3(0.75, 0.92, 1.0) * a, 1.0);',
      '}'
    ].join('\n'),
    blending: THREE.AdditiveBlending, transparent: true, depthTest: false, depthWrite: false
  });
  var rays = new THREE.Mesh(new THREE.PlaneBufferGeometry(1, 1), rayMat);
  rays.scale.set(W, H, 1); rays.position.set(W / 2, H / 2, 0);
  rays.renderOrder = 500;
  scene.add(rays);

  // ---- the disco: at night, with music, coloured spots wander the tank and
  // two spotlight beams sweep it, pulsing on the beat, the colours changing each phrase; it
  // fades back to moonlight when the music stops
  // one set of values for everything the disco lights, and the light itself:
  // the coloured spots at a point on the screen, for the overlay and for each
  // fish, the crab and the anemone to light their own colours with
  var discoU = { dT: { value: 0 }, dAmount: { value: 0 }, dPulse: { value: 0 }, dHue: { value: 0 }, dSize: { value: new THREE.Vector2(W, H) } };
  var DISCO_GLSL = [
    'uniform float dT; uniform float dAmount; uniform float dPulse; uniform float dHue; uniform vec2 dSize;',
    'vec3 discoPalette(float k) { k = fract(k); return k < 0.25 ? vec3(1.0, 0.25, 0.7) : k < 0.5 ? vec3(0.2, 0.9, 1.0) : k < 0.75 ? vec3(0.65, 0.35, 1.0) : vec3(1.0, 0.8, 0.25); }',
    // two spotlight beams shining down from above either side of the tank,
    // sweeping back and forth across it; returns the light at a point, and the
    // beams' own haze in the water (brighter at the sand) as w
    'vec4 discoBeams(vec2 px) {',
    '  vec3 col = vec3(0.0); float haze = 0.0;',
    '  for (int i = 0; i < 2; i++) {',
    '    float fi = float(i), side = fi * 2.0 - 1.0;',
    '    vec2 o = vec2(dSize.x * (0.5 + side * 0.36), dSize.y * 1.08);',
    '    vec2 aim = vec2(dSize.x * (0.5 - side * 0.3 * sin(dT * 0.55 + fi * 1.3)), dSize.y * 0.06);',
    '    vec2 a = normalize(aim - o), v = px - o;',
    '    float along = dot(v, a), across = length(v - along * a);',
    '    float width = 14.0 + along * 0.2;',
    '    float beam = along > 0.0 ? smoothstep(width, width * 0.45, across) : 0.0;',
    '    vec3 c = discoPalette(dHue + fi * 0.5);',
    '    col += c * beam;',
    '    haze += beam * (0.35 + 0.65 * smoothstep(dSize.y * 0.3, 0.0, px.y)) ;',
    '  }',
    '  return vec4(col, haze) * dAmount * (0.6 + 0.55 * dPulse);',
    '}',
    // the coloured disco spots: soft pools of light wandering the tank
    'vec3 discoPools(vec2 px) {',
    '  vec3 col = vec3(0.0);',
    '  for (int i = 0; i < 5; i++) {',
    '    float fi = float(i);',
    '    vec2 c = vec2(dSize.x * (0.5 + 0.42 * sin(dT * (0.31 + fi * 0.07) + fi * 1.9)), dSize.y * (0.42 + 0.36 * sin(dT * (0.23 + fi * 0.05) + fi * 2.7)));',
    '    float r = dSize.y * (0.2 + 0.05 * sin(fi * 3.1));',
    '    float d = length((px - c) / vec2(1.25, 1.0)) / r;',
    '    col += discoPalette(dHue + fi * 0.25) * smoothstep(1.0, 0.15, d);',
    '  }',
    '  return col * dAmount * (0.55 + 0.6 * dPulse);',
    '}',
    // sparkles, as from a mirror ball hanging just above the tank, out of
    // sight: small bright flecks turning round the tank, none close to it
    'vec3 discoSparkle(vec2 px) {',
    '  vec2 rel = px - vec2(dSize.x * 0.5, dSize.y * 1.06); float ang = atan(rel.y, rel.x), rad = length(rel);',
    '  vec2 cell = vec2(floor((ang + dT * 0.35) * 18.0), floor(rad / 26.0));',
    '  float h = fract(sin(dot(cell, vec2(127.1, 311.7))) * 43758.5453);',
    '  vec2 inCell = vec2(fract((ang + dT * 0.35) * 18.0), fract(rad / 26.0)) - 0.5;',
    '  float fleck = step(0.74, h) * smoothstep(0.32, 0.0, length(inCell * vec2(1.0, 1.0 + rad / 260.0))) * (0.6 + 0.4 * sin(dT * 9.0 + h * 40.0));',
    '  fleck *= smoothstep(dSize.y * 0.3, dSize.y * 0.65, rad);',
    '  return mix(vec3(1.0), discoPalette(dHue + h), 0.5) * fleck * 1.1 * dAmount * (0.55 + 0.6 * dPulse);',
    '}',
    'vec3 discoSpots(vec2 px) { return discoBeams(px).rgb + discoPools(px) * 0.8 + discoSparkle(px); }'
  ].join('\n');
  var discoMat = new THREE.ShaderMaterial({
    uniforms: Object.assign({ reef: reefMat.uniforms.map }, discoU),
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      DISCO_GLSL,
      'uniform sampler2D reef;',
      // open water is smooth; rock, coral and sand are full of detail. Detail is
      // gathered from around each point so the rocks count as solid areas
      'float detailAt(vec2 uv, vec2 o) {',
      '  vec3 c = texture2D(reef, uv).rgb;',
      '  vec3 n = (texture2D(reef, uv + vec2(o.x, 0.0)).rgb + texture2D(reef, uv - vec2(o.x, 0.0)).rgb + texture2D(reef, uv + vec2(0.0, o.y)).rgb + texture2D(reef, uv - vec2(0.0, o.y)).rgb) * 0.25;',
      '  return length(c - n);',
      '}',
      '#define t dT', '#define amount dAmount', '#define pulse dPulse', '#define hue dHue', '#define size dSize', '#define palette discoPalette',
      'varying vec2 vUv;',
// Dave Hoskins' hash: no sin() and no huge multiplier, so every graphics
// card gives a corner of the noise's grid one value (with the sin() version
// some, by Vulkan, cut the noise into hard rectangles)
'float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }',
      'void main() {',
      '  vec2 px = vUv * size;',
      // the beams in the water: shafts of coloured light, brighter where they
      // meet the sand (the creatures light themselves)
      '  vec4 b = discoBeams(px);',
      // sparkles land only on things: where the tank's picture is rock, coral or
      // sand (brighter, or less blue) rather than open water; the creatures
      // catch them themselves
      '  vec2 o = 3.0 / size, r = 9.0 / size;',
      '  float detail = 0.0;',
      '  for (int k = 0; k < 8; k++) { float a = float(k) * 0.785; detail = max(detail, detailAt(vUv + vec2(cos(a), sin(a)) * r, o)); }',
      '  detail = max(detail, detailAt(vUv, o));',
      '  float solid = max(smoothstep(0.02, 0.06, detail), smoothstep(0.45, 0.65, dot(texture2D(reef, vUv).rgb, vec3(0.3, 0.55, 0.15))));',
      '  vec3 sparkle = discoSparkle(px) * solid;',
      // the light above the water, where the sparkles come from: a glow
      // through the top middle of the surface, shimmering with its ripples,
      // and faint rays fanning down from it, turning slowly
      '  vec2 src = vec2(size.x * 0.5, size.y * 1.06);',
      '  vec2 q = (px - src) / size.y;',
      '  float ripple = 0.75 + 0.25 * sin(px.x * 0.045 + t * 1.7) * sin(px.x * 0.021 - t * 1.1 + px.y * 0.03);',
      '  float glow = exp(-dot(q * vec2(0.9, 1.6), q * vec2(0.9, 1.6)) * 7.0) * ripple;',
      '  float ang2 = atan(q.x, -q.y);',
      '  float rays = pow(max(0.0, sin(ang2 * 11.0 + t * 0.35)), 6.0) * exp(-length(q) * 2.6) * smoothstep(0.02, 0.2, length(q));',
      '  vec3 above = mix(vec3(0.9, 0.9, 1.0), palette(hue + 0.12), 0.35) * (glow * 0.55 + rays * 0.28) * amount * (0.7 + 0.45 * pulse);',
      '  gl_FragColor = vec4(min(b.rgb * (0.2 + 0.22 * b.a), vec3(0.45)) + discoPools(px) * 0.5 + sparkle + above, 1.0);',
      '}'
    ].join('\n'),
    blending: THREE.AdditiveBlending, transparent: true, depthTest: false, depthWrite: false
  });
  var disco = new THREE.Mesh(new THREE.PlaneBufferGeometry(1, 1), discoMat);
  disco.scale.set(W, H, 1); disco.position.set(W / 2, H / 2, 0); disco.renderOrder = 550;
  scene.add(disco);

  // ---- fish: a cut-out on a bendable strip; the tail beats and the body flexes,
  // and a turn narrows the fish to its edge and flips it
  // A turn is a bend, as a real fish turns: the head swings round first and the
  // body follows it, so from the side the fish folds into a U rather than
  // narrowing to nothing. turn runs from 0 (facing as the picture) to 1
  // (turned round); each point along the body turns a little after the one
  // ahead of it, and its place is the sum of the steps before it.
  var fishVert = [
    'uniform float phase; uniform float amp; uniform float turn; uniform float bend; uniform float bulge;',
    'varying vec2 vUv; varying float vSide;',
    'float along(float u) { return clamp(turn * 1.9 - u * 0.9, 0.0, 1.0); }',
    'float reach(float u) {',
    '  float x = 0.0;',
    '  for (int k = 0; k < 10; k++) x += cos(3.14159 * along((float(k) + 0.5) / 10.0 * u));',
    '  return x * u / 10.0;',
    '}',
    'void main() {',
    '  vUv = uv;',
    '  vec3 p = position;',                              // x from -0.5 (head) to 0.5 (tail)
    '  float u = p.x + 0.5;',
    '  float tail = smoothstep(0.45, 1.0, u);',
    '  float body = u;',
    // swimming: the tail sweeps toward and away from the viewer (it foreshortens
    // and lifts a little); the body carries a softer wave
    '  float sweep = tail * tail * amp;',
    '  p.x = reach(u) - reach(0.5) - sweep * 0.09 * (0.5 - 0.5 * cos(phase * 2.0));',
    '  p.y += (tail * tail * 0.05 + body * 0.012) * amp * sin(phase - u * 3.0);',
    // puffing (the pufferfish): the middle of the body swells round, above and
    // below, while the head and tail keep their size
    '  float belly = smoothstep(0.08, 0.42, u) * (1.0 - smoothstep(0.62, 0.92, u));',
    '  p.y *= 1.0 + bulge * belly;',
    // mid-turn the body arcs a little, and the side facing away is shaded
    '  float t = along(u);',
    '  p.y += sin(3.14159 * turn) * 0.05 * sin(3.14159 * u) + bend * body * body * 0.08;',
    '  vSide = abs(cos(3.14159 * t));',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);',
    '}'
  ].join('\n');
  var fishFrag = [
    DISCO_GLSL,
    'uniform sampler2D map; uniform float haze; uniform vec3 water; uniform float light; uniform vec3 tint; uniform float alpha;',
    'varying vec2 vUv; varying float vSide;',
    'void main() {',
    '  vec4 c = texture2D(map, vUv);',
    '  if (c.a < 0.03) discard;',
    '  vec3 col = c.rgb * (0.7 + 0.3 * vSide) * light;',   // a part seen edge-on in a turn: a little darker
    '  col = mix(col, water, haze) * (tint + min(discoSpots(gl_FragCoord.xy) * 1.05, vec3(1.3)) + vec3(0.24, 0.22, 0.28) * dAmount);',
    '  gl_FragColor = vec4(col, c.a * alpha);',
    '}'
  ].join('\n');

  var SPECIES = [
    { file: 'ectodeck-asset:aquarium/clownfish.webp', len: 90, speed: 38, beat: 9, count: 2, band: [0.2, 0.6], part: 'high' },
    { file: 'ectodeck-asset:aquarium/idol.webp', len: 128, speed: 34, beat: 6, count: 1, band: [0.35, 0.82], part: 'mid' },
    { file: 'ectodeck-asset:aquarium/regal.webp', len: 136, speed: 50, beat: 7, count: 2, band: [0.3, 0.85], part: 'bass' },
    { file: 'ectodeck-asset:aquarium/yellowtang.webp', len: 120, speed: 46, beat: 7, count: 2, band: [0.3, 0.85], part: 'bass' },
    { file: 'ectodeck-asset:aquarium/angel.webp', len: 158, speed: 30, beat: 5, count: 1, band: [0.3, 0.75], part: 'bass' },
    { file: 'ectodeck-asset:aquarium/copperband.webp', len: 112, speed: 28, beat: 6, count: 1, band: [0.25, 0.65], part: 'mid' },
    { file: 'ectodeck-asset:aquarium/anthias.webp', len: 82, speed: 56, beat: 10, count: 2, band: [0.4, 0.9], part: 'high' },
    // the puffer swims like the rest and blows up into a spiky ball when startled
    { file: 'ectodeck-asset:aquarium/puffer.webp', puffed: 'ectodeck-asset:aquarium/puffed.webp', len: 100, speed: 24, beat: 8, count: 1, band: [0.3, 0.7], part: 'mid' },
  ];
  var fish = [];
  SPECIES.forEach(function (sp) {

    var ft = fGeo.attributes.turn.array;
    for (i = 0; i < MAXF; i++) { var p = food[i]; fp[i * 3] = p ? p.x : -99; fp[i * 3 + 1] = p ? p.y : -99; fs[i] = p ? p.s : 0; if (p) { ft[i * 3] = p.rot; ft[i * 3 + 1] = Math.cos(clock.t * p.flutter + p.spin); ft[i * 3 + 2] = p.kind; } }
    fGeo.attributes.turn.needsUpdate = true;
    fGeo.attributes.position.needsUpdate = true; fGeo.attributes.scale.needsUpdate = true;
  }

  // most settings arrive in place (the number of fish and the pufferfish
  // need the tank set up again), so the fish keep
  // swimming; any other setting starts the page again with the new address
  var startQuery = location.search;
  window.addEventListener('ectodeck:params', function (e) {
    var p = e.detail, now = new URLSearchParams(location.search), was = new URLSearchParams(startQuery);
    var keys = Array.from(now.keys()).concat(Array.from(was.keys()));
    for (var i = 0; i < keys.length; i++) if (['time', 'bubbles', 'dance', 'energy', 'disco', 'speed', 'crab', 'anemone'].indexOf(keys[i]) < 0 && now.get(keys[i]) !== was.get(keys[i])) return location.reload();
    if (p.time !== undefined) { timeSetting = Math.round(p.time); light = timeSetting < 0 ? clockLight() : timeSetting % 3; }
    if (p.bubbles !== undefined) bubbler = !!p.bubbles && p.bubbles !== '0';
    if (p.dance !== undefined) dancing = truthy(p.dance);
    if (p.energy !== undefined) energy = Math.min(1.6, Math.max(0.3, Number(p.energy)));
    if (p.disco !== undefined) discoMode = Math.round(Number(p.disco));
    if (p.speed !== undefined) swimSpeed = Math.min(1.8, Math.max(0.4, Number(p.speed)));
    if (p.crab !== undefined) showCrab = truthy(p.crab);
    if (p.anemone !== undefined) showAnemone = truthy(p.anemone);
  });
  addEventListener('resize', function () { location.reload(); });

  // The scene is drawn into a hidden picture first and copied to the screen
  // in one step, so the screen only ever holds a finished frame: drawn
  // straight onto it, piece by piece, the deck's headless Chrome now and then
  // took a frame part-way, with a fish or the backdrop missing.
  var finished = new THREE.WebGLRenderTarget(W, H, { depthBuffer: false });
  var copyScene = new THREE.Scene(), copyCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  copyScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: { map: { value: finished.texture } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D map; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(map, vUv).rgb, 1.0); }',
    depthTest: false, depthWrite: false
  })));
  function present() {
    renderer.setRenderTarget(finished);
    renderer.autoClear = true;
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.autoClear = false;   // the copy covers the whole screen; no clear in between
    renderer.render(copyScene, copyCamera);
  }

  // ?record: time only moves when asked, one frame at a time, for a smooth recording
  if (/record/.test(location.search)) {
    window.advance = function (seconds) { step(seconds); present(); };
    return;
  }

  var last = performance.now();
  (function frame(now) {
    step(Math.min(0.05, (now - last) / 1000)); last = now;
    present();
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
